 }else if(wd.id==="lava"){
  ctx.fillStyle=flash?"#fff":"#4a2418";
  ctx.beginPath();ctx.moveTo(b.x,b.y+b.h);ctx.lineTo(b.x+8,b.y+16);ctx.lineTo(b.x+26,b.y);ctx.lineTo(b.x+b.w-26,b.y);ctx.lineTo(b.x+b.w-8,b.y+16);ctx.lineTo(b.x+b.w,b.y+b.h);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle="#ff7a2e";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(b.x+14,b.y+b.h-6);ctx.lineTo(b.x+30,b.y+30);ctx.lineTo(b.x+44,b.y+44);ctx.lineTo(b.x+60,b.y+22);ctx.stroke();
  ctx.fillStyle="#ffd24e";ctx.fillRect(cx-22+lookX,cy-10+lookY,12,8);ctx.fillRect(cx+10+lookX,cy-10+lookY,12,8);
 }else if(wd.id==="ice"){
  ctx.fillStyle=flash?"#fff":"#8fd8ff";
  ctx.beginPath();ctx.moveTo(cx,b.y-6);ctx.lineTo(b.x+b.w+4,cy);ctx.lineTo(cx,b.y+b.h+6);ctx.lineTo(b.x-4,cy);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.moveTo(cx,b.y+2);ctx.lineTo(cx+16,cy);ctx.lineTo(cx,cy+6);ctx.closePath();ctx.fill();
  ctx.fillStyle="#0a3a66";ctx.beginPath();ctx.arc(cx+lookX,cy+lookY,9,0,6.283);ctx.fill();
  ctx.fillStyle="#bff2ff";ctx.beginPath();ctx.arc(cx+lookX,cy+lookY,3.5,0,6.283);ctx.fill();
 }else{
  ctx.fillStyle=flash?"#fff":"#1a0b38";ctx.fillRect(b.x+6,b.y+4,b.w-12,b.h-8);
  ctx.strokeStyle=flash?"#fff":col;ctx.lineWidth=3;ctx.strokeRect(b.x+6,b.y+4,b.w-12,b.h-8);
  ctx.shadowBlur=0;
  for(let i=0;i<4;i++){const a=now*.003+i*1.57;ctx.fillStyle="#ff2bd6";ctx.fillRect(cx+Math.cos(a)*54-4,cy+Math.sin(a)*40-4,8,8)}
  ctx.fillStyle=col;ctx.fillRect(cx-20+lookX,cy-8+lookY,16,10);ctx.fillRect(cx+4+lookX,cy-8+lookY,16,10);
  if(Math.floor(now/110)%9===0){ctx.fillStyle="#ff2bd6";ctx.fillRect(b.x-8,cy+10,b.w+16,4)}
 }
 ctx.restore();
}
function drawBossBar(wd){
 const b=boss;if(!b||b.dead)return;
 const w=Math.min(280,W-40),x=(W-w)/2,y=134;
 ctx.save();ctx.textAlign="center";
 ctx.fillStyle="#fff";ctx.font="bold 13px Arial";ctx.shadowBlur=SB(6);ctx.shadowColor="#000";
 ctx.fillText(b.name,W/2,y-4);ctx.shadowBlur=0;
 ctx.fillStyle="rgba(8,14,34,.8)";ctx.fillRect(x,y,w,10);
 const sw=(w-(b.max-1)*3)/b.max;
 for(let i=0;i<b.max;i++){ctx.fillStyle=i<b.hp?wd.acc:"rgba(255,255,255,.12)";ctx.fillRect(x+i*(sw+3),y+1,sw,8)}
 ctx.restore();
}

function drawGoal(now){
 const g=goal,cx=g.x+g.w/2,cy=g.y+g.h/2;
 if(g.locked){
  ctx.fillStyle="#3a2a55";ctx.fillRect(g.x,g.y,g.w,g.h);
  ctx.strokeStyle="#8a78b8";ctx.lineWidth=3;
  for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(g.x,g.y+10+i*24);ctx.lineTo(g.x+g.w,g.y+10+i*24);ctx.stroke()}
  return;
 }
 ctx.save();ctx.shadowBlur=SB(26);ctx.shadowColor="#b34cff";
 ctx.fillStyle="#b34cff";ctx.fillRect(g.x,g.y,g.w,g.h);
 ctx.shadowBlur=0;
 ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=2;
 for(let i=0;i<3;i++){const r=((now*.03+i*14)%40);ctx.globalAlpha=1-r/40;ctx.beginPath();ctx.ellipse(cx,cy,10+r*.6,20+r,0,0,6.283);ctx.stroke()}
 ctx.restore();
}

function drawGhosts(now){
 for(const p of netPeers){
  if(p.isMe||xSocial.blocked(p.by))continue;
  const pr=p.presence||{};
  let sc=social.get(p.peer);
  if(!sc){sc={em:"",et:null,emAt:-1e9,say:"",st:null,sayAt:-1e9};social.set(p.peer,sc)}
  if(pr.et!==sc.et&&typeof pr.em==="string"&&EMOTES.includes(pr.em)){sc.et=pr.et;sc.em=pr.em;sc.emAt=now}
  if(pr.st!==sc.st&&typeof pr.say==="string"){sc.st=pr.st;sc.say=pr.say.slice(0,40);sc.sayAt=now}
  if(!pr.play||pr.lvl!==level||typeof pr.x!=="number"||typeof pr.y!=="number")continue;
  let g=ghosts.get(p.peer);
  if(!g){g={x:pr.x,y:pr.y};ghosts.set(p.peer,g)}
  g.x+=(pr.x-g.x)*.35;g.y+=(pr.y-g.y)*.35;
  const sk=skinById(typeof pr.k==="string"?pr.k:"neon");
  drawHero(ctx,g.x,g.y,30,38,sk,{a:.6,t:now,face:1,sq:1,gear:xGearApi.decode(pr.gr)});
  if(pr.f){ctx.strokeStyle=safeColor(pr.c);ctx.lineWidth=2;ctx.beginPath();ctx.arc(g.x+15,g.y+19,28,0,6.283);ctx.stroke()}
  ctx.font="bold 12px Arial";ctx.textAlign="center";
  ctx.fillStyle="#fff";ctx.shadowBlur=SB(4);ctx.shadowColor="#000";
  ctx.fillText(nameOf(p.by),g.x+15,g.y-14);
  ctx.shadowBlur=0;
  if(now-sc.sayAt<5000&&sc.say&&!xSocial.muted(p.by))bubble(g.x+15,g.y-30,sc.say,12);
  if(now-sc.emAt<2500&&sc.em&&!xSocial.muted(p.by))bubble(g.x+15,g.y-(now-sc.sayAt<5000?50:32),sc.em,24);
 }
}
function bubble(x,y,text,size){
 ctx.font=size+"px Arial";ctx.textAlign="center";
 if(size>16){ctx.fillStyle="#fff";ctx.fillText(text,x,y);return}
 const w=Math.min(180,ctx.measureText(text).width+14);
 ctx.fillStyle="rgba(16,40,74,.92)";ctx.fillRect(x-w/2,y-14,w,20);
 ctx.strokeStyle="#4eeaff";ctx.lineWidth=1;ctx.strokeRect(x-w/2,y-14,w,20);
 ctx.fillStyle="#fff";ctx.fillText(text,x,y);
}

function drawParticles(){
 for(const p of particles){
  const a=p.life/p.max;
  ctx.globalAlpha=Math.max(0,a);
  switch(p.type){
   case"c":ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.5+a*.5),0,6.283);ctx.fill();break;
   case"s":ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*.2);ctx.fillRect(-p.size/2,-1,p.size,2);ctx.fillRect(-1,-p.size/2,2,p.size);ctx.restore();break;
   case"ring":ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-a)+4,0,6.283);ctx.stroke();break;
   case"t":ctx.fillStyle=p.color;ctx.font="bold "+p.size+"px Arial";ctx.textAlign="center";ctx.shadowBlur=SB(4);ctx.shadowColor="#000";ctx.fillText(p.txt,p.x,p.y);ctx.shadowBlur=0;break;
   default:ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);
  }
 }
 ctx.globalAlpha=1;
}

/* ===================== ציור: מסך פתיחה ===================== */
function drawMenuBg(now){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#1c0a40");g.addColorStop(.55,"#0c0522");g.addColorStop(1,"#05030f");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const hz=H*.6,sr=Math.min(W,H)*.2;
 for(let i=0;i<90;i++){
  const x=(i*137)%W,y=(i*71)%(hz);
  ctx.fillStyle="rgba(190,170,255,"+(.25+.5*Math.pow(Math.sin(now*.0015+i),2)).toFixed(2)+")";
  ctx.fillRect(x,y,i%9===0?3:2,i%9===0?3:2);
 }
 const sg=ctx.createLinearGradient(0,hz-sr*1.7,0,hz);
 sg.addColorStop(0,"#ffd24e");sg.addColorStop(.55,"#ff5ac8");sg.addColorStop(1,"#6a2bd6");
 ctx.save();ctx.beginPath();ctx.arc(W/2,hz-sr*.7,sr,0,6.283);ctx.clip();
 ctx.fillStyle=sg;ctx.fillRect(W/2-sr,hz-sr*1.7,sr*2,sr*2);
 ctx.fillStyle="#0c0522";
 for(let i=0;i<8;i++){const yy=hz-sr*.7+i*sr*.17,hh=2+i*1.6;ctx.fillRect(W/2-sr,yy+((now*.01)%12)*.2,sr*2,hh)}
 ctx.restore();
 ctx.fillStyle="#07031a";ctx.fillRect(0,hz,W,H-hz);
 ctx.strokeStyle="rgba(255,90,200,.55)";ctx.lineWidth=1;
 for(let i=0;i<14;i++){const t=((i+(now*.0006)%1)/14),y=hz+Math.pow(t,2.2)*(H-hz);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.strokeStyle="rgba(78,234,255,.4)";
 for(let i=-12;i<=12;i++){ctx.beginPath();ctx.moveTo(W/2+i*10,hz);ctx.lineTo(W/2+i*W*.12,H);ctx.stroke()}
 // פלטפורמות צפות
 for(let i=0;i<5;i++){
  const px=((i*173+now*.01*(1+i*.15))%(W+160))-80,py=hz*.35+((i*61)%120)+Math.sin(now*.001+i)*10;
  ctx.fillStyle="rgba(27,58,98,.8)";ctx.fillRect(px,py,90,12);
  ctx.fillStyle="#4eeaff";ctx.fillRect(px,py,90,3);
 }
 // הגיבור רץ וקופץ
 const sk=skinById(skins.eq);
 const cyc=(now*.00018)%1,x=cyc*(W+80)-40;
 const jp=Math.abs(Math.sin(now*.0032)),jy=Math.pow(jp,.8)*70;
 const gy=H*.93-38;
 for(let i=1;i<=6;i++){
  ctx.fillStyle=(sk.glow==="hue"?"hsl("+((now*.2+i*30)%360|0)+",90%,60%)":sk.glow);
  ctx.globalAlpha=.4-i*.06;ctx.beginPath();ctx.arc(x-i*9,gy+30-jy*.4,5-i*.5,0,6.283);ctx.fill();
 }
 ctx.globalAlpha=1;
 drawHero(ctx,x,gy-jy,30,38,sk,{t:now,face:1,sq:1+(jy>40?.12:-.05),gear:xGearApi.eq()});
}

/* ===================== ציור ראשי ===================== */
function draw(){
 const now=performance.now();tNow=now;
 ctx.clearRect(0,0,W,H);
 if(menuOn||!player){drawMenuBg(now);return}
 const wd=worldOf(level);
 ctx.save();run("draw.pre",ctx,now);
 drawBg(wd,now);
 if(OX>0){
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.fillRect(0,0,OX,H);ctx.fillRect(OX+PW*S,0,W-OX-PW*S,H);
  ctx.fillStyle="rgba(78,234,255,.35)";
  ctx.fillRect(OX-2,0,2,H);ctx.fillRect(OX+PW*S,0,2,H);
 }
 ctx.save();
 ctx.beginPath();ctx.rect(OX,0,PW*S,H);ctx.clip();
 ctx.translate(OX+(shake?(Math.random()-.5)*shake*S:0),(shake?(Math.random()-.5)*shake*S:0));
 ctx.scale(S,S);ctx.translate(0,-camY);

 for(const p of platforms)drawPlat(p,wd,now);

 for(const h of hazards)drawHazard(h,wd,now);

 for(const o of coinsL){
  if(o.taken)continue;
  const sx=Math.abs(Math.cos(now*.006+o.ph)),r=o.v>1?10:7;
  ctx.save();ctx.shadowBlur=o.v>1?18:10;ctx.shadowColor="#ffd24e";
  ctx.fillStyle=o.v>1?"#fff2a0":"#ffd24e";
  ctx.beginPath();ctx.ellipse(o.x,o.y+Math.sin(now*.004+o.ph)*2,Math.max(1.5,r*sx),r,0,0,6.283);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle="#b8860b";
  ctx.beginPath();ctx.ellipse(o.x,o.y+Math.sin(now*.004+o.ph)*2,Math.max(1,r*sx*.5),r*.55,0,0,6.283);ctx.fill();
  ctx.restore();
 }
 for(const o of orbs){
  if(o.taken)continue;
  const pulse=1+Math.sin(now*.006+o.x)*.2;
  ctx.beginPath();ctx.arc(o.x,o.y,9*pulse,0,6.283);
  ctx.fillStyle="#50f3ff";ctx.shadowBlur=SB(22);ctx.shadowColor="#50f3ff";
  ctx.fill();ctx.shadowBlur=0;
 }

 drawGoal(now);
 drawBoss(wd,now);
 for(const b of bullets){
  ctx.save();ctx.shadowBlur=SB(14);ctx.shadowColor="#ff2bd6";
  ctx.fillStyle="#ff6ad5";ctx.beginPath();ctx.arc(b.x,b.y,7,0,6.283);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x,b.y,3,0,6.283);ctx.fill();ctx.restore();
 }

 drawGhosts(now);
 run("draw.world",ctx,wd,now);

 if(!(inv>0&&Math.floor(inv/5)%2===0)&&!(xPhoto.on&&xPhoto.hide)){
  drawHero(ctx,player.x,player.y,30,38,skinById(skins.eq),{t:now,face:player.face,sq:player.sq,gear:xGearApi.eq()});
 }
 if(isAdmin&&cheat.fly){
  ctx.beginPath();ctx.arc(player.x+15,player.y+19,28,0,6.283);
  ctx.strokeStyle="rgba(255,210,78,.85)";ctx.lineWidth=2;ctx.stroke();
 }
 if(shield>0){
  const cx=player.x+15,cy=player.y+19;
  ctx.save();ctx.shadowBlur=SB(14);ctx.shadowColor="#6bffb0";ctx.strokeStyle="rgba(107,255,176,.85)";ctx.lineWidth=2;
  for(let i=0;i<shield;i++){const a0=now*.003+i*(6.283/shield);ctx.beginPath();ctx.arc(cx,cy,31,a0,a0+1.7);ctx.stroke()}
  ctx.restore();
 }
 const saying=now-mySay.at<5000&&mySay.text;
 if(saying)bubble(player.x+15,player.y-12,mySay.text,12);
 if(now-myEm.at<2500&&myEm.em)bubble(player.x+15,player.y-(saying?34:14),myEm.em,24);

 drawParticles();
 ctx.restore();
 run("draw.screen",ctx,wd,now);

 if(slow.t>0){
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);
  v.addColorStop(0,"rgba(40,140,255,0)");v.addColorStop(1,"rgba(40,120,255,.35)");
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(120,200,255,.06)";ctx.fillRect(0,0,W,H);
 }
 drawBossBar(wd);
 if(banner.t>0&&playing){
  const a=Math.min(1,banner.t/30,(150-banner.t)/12+.2);
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.textAlign="center";
  ctx.fillStyle="#fff";ctx.shadowBlur=SB(18);ctx.shadowColor=wd.acc;
  ctx.font="bold 38px Arial";ctx.fillText(banner.title,W/2,H*.27);
  if(banner.sub){ctx.font="bold 20px Arial";ctx.fillStyle=wd.acc;ctx.fillText(banner.sub,W/2,H*.27+32)}
  ctx.restore();
 }
 if(boss&&!boss.dead&&boss.dying===0&&banner.t===0&&playing){
  ctx.save();ctx.globalAlpha=.8;ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="12px Arial";
  ctx.fillText("הבס את הבוס כדי לפתוח את השער: קפוץ עליו מלמעלה",W/2,H-(settings.device==="phone"?132:36));
  ctx.restore();
 }
 run("draw.post",ctx,wd,now);
 ctx.restore();
}

let loopErr=0,loopErrT=0;
function loopBody(){
 const t0=performance.now(),dt=t0-(loop.last||t0);loop.last=t0;loop.avg=(loop.avg||16)*.97+Math.min(dt,100)*.03;
 if(frame%60===0){const q=settings.quality||"auto";if(q==="low")QLOW=true;else if(q==="high")QLOW=false;else if(loop.avg>27)QLOW=true;else if(loop.avg<18&&frame%900===0)QLOW=false}
 run("frame");
 if(!paused){if(toast>0)toast--;if(banner.t>0)banner.t--}
 frame++;
 update();
 if(player&&playing&&!paused){
  const targetY=Math.min(worldH-Hl,Math.max(0,player.y-Hl*.55));
  camY+=(targetY-camY)*.15;
 }
 draw();
 if(frame%3===0)netTick();
 if(frame%15===0)updateBar();
 if(playing)updateSlowUI();
}
/* הלולאה לא נעצרת לעולם: שגיאה בפריים לא מקפיאה את המשחק. אחרי שגיאות חוזרות המשחק מתאושש לבד */
function loop(){
 try{loopBody();loopErr=0}
 catch(e){
  loopErr++;
  try{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.setLineDash([])}catch(_){}
  try{modErr("loop",e)}catch(_){}
  if(loopErr>=90){loopErr=0;try{unstick("auto")}catch(_){}}
 }
 requestAnimationFrame(loop);
}
/* חילוץ: סוגר מסכים וחלונות תקועים, מנקה מצבים ומחזיר לתפריט בלי לאבד התקדמות */
function unstick(why){
 try{if(typeof RACE!=="undefined"&&RACE)endRace(true)}catch(e){}
 try{if(typeof INTRO!=="undefined"&&INTRO&&INTRO.box){INTRO.box.remove();INTRO=null}}catch(e){}
 try{if(typeof closeDialog==="function")closeDialog()}catch(e){}
 try{if(typeof wheelBusy!=="undefined")wheelBusy=false}catch(e){}
 for(const id of["screen","shop","settings","pause"]){try{$(id).style.display="none"}catch(e){}}
 if(screenCleanup){try{screenCleanup()}catch(e){}screenCleanup=null}
 try{xmode=null;bullets=[];particles=[];paused=false;playing=false;keys={};run("menu")}catch(e){}
 try{save()}catch(e){}
 try{renderMenu()}catch(e){}
 note(why==="auto"?"המשחק התאושש משגיאה. ההתקדמות נשמרה":"המשחק אופס והועבר לתפריט. ההתקדמות נשמרה");
}
/* מפעיל גם אחרי חזרה מרקע, וגם מעקב על תקיעה: אם הלולאה לא רצה 3 שניות היא מופעלת מחדש */
let lastBeat=performance.now();
const _loopRaw=loop;
setInterval(()=>{if(performance.now()-loop.last>3000&&!document.hidden){loop.last=performance.now();try{requestAnimationFrame(loop)}catch(e){}}},1500);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){loop.last=performance.now();keys={};try{audioInit()}catch(e){}}});
window.addEventListener("error",e=>{try{modErr("window",e.error||e.message)}catch(_){}});
window.addEventListener("unhandledrejection",()=>{});
window.addEventListener("blur",()=>{keys={}});

/* ===================== התחלה ===================== */
run("init");
applyDevice();
if(!settings.device)openSettings(true);
renderMenu();
updateHUD();updateBar();
initCaps();
loop();
</script>
