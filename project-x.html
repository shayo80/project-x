<title>PROJECT X</title>
<style>
/* Layout: one full-screen canvas stage; menus, panels and controls are overlays inside it. One neon-dark world by design (the game's own look). */
:root{
 --bg:#06081a;--panel:#0f2244;--panel2:#0a1a36;--line:#5eeaff;--cyan:#4eeaff;
 --text:#ffffff;--muted:#a9b9d9;--danger:#ff315f;--ok:#6bffb0;--violet:#b34cff;--gold:#ffd24e;--pink:#ff2bd6;
 --tb:clamp(60px,18vw,86px);
 color-scheme:dark;
}
html,body{height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0}
button{padding:12px 28px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:17px;border-radius:12px;cursor:pointer;margin:0;font-family:inherit;transition:transform .12s,background .12s,box-shadow .12s}
button:hover{background:#17618a}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed;background:var(--panel);transform:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.note{color:var(--muted);font-size:14px;max-width:420px;margin:4px 0 10px}

/* ---- HUD ---- */
#hud{position:absolute;top:10px;left:12px;right:12px;display:none;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;z-index:2;pointer-events:none;font-size:14px}
.pill{background:rgba(8,14,34,.72);border:1px solid rgba(94,234,255,.35);border-radius:999px;padding:5px 12px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;text-shadow:0 0 6px #000;backdrop-filter:blur(2px)}
#hud .c1{justify-self:start}#hud .c2{justify-self:center}#hud .c3{justify-self:end}
.dotw{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);flex:none}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd24e 55%,#b8860b);box-shadow:0 0 8px #ffd24e;flex:none}
#bar{position:absolute;top:50px;left:12px;right:12px;display:none;gap:8px;z-index:4;align-items:center;flex-wrap:wrap}
.ib{width:38px;height:38px;padding:0;font-size:17px;border-radius:10px;opacity:.92;display:inline-flex;align-items:center;justify-content:center}
#bar .pill{font-size:13px;padding:4px 10px}
#slowP{background-size:100% 100%;background-repeat:no-repeat}
#help{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:var(--muted);font-size:13px;pointer-events:none;display:none;text-shadow:0 0 6px #000}

/* ---- touch controls ---- */
#touch{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;right:14px;display:none;justify-content:space-between;align-items:flex-end;z-index:4;direction:ltr;pointer-events:none}
#touch .grp{display:flex;gap:12px;align-items:flex-end;pointer-events:none}
#touch .col{flex-direction:column;align-items:flex-end}
.tb{width:var(--tb);height:var(--tb);padding:0;font-size:26px;border-radius:50%;opacity:.72;touch-action:none;pointer-events:auto;background:rgba(15,34,68,.8);position:relative}
.tb.sm{width:calc(var(--tb)*.72);height:calc(var(--tb)*.72);font-size:21px}
#tslow{--cd:0%;background:conic-gradient(rgba(78,234,255,.55) var(--cd),rgba(15,34,68,.8) 0)}
.tb.big{width:calc(var(--tb)*1.1);height:calc(var(--tb)*1.1)}

/* ---- toasts ---- */
#note{position:absolute;top:96px;left:50%;transform:translateX(-50%);background:rgba(16,40,74,.95);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:15px;z-index:11;pointer-events:none;opacity:0;transition:opacity .25s;max-width:calc(100% - 32px);text-align:center}
#note.on{opacity:1}
#toasts{position:absolute;top:136px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:11;pointer-events:none}
.toastc{background:linear-gradient(135deg,rgba(40,24,90,.96),rgba(14,60,100,.96));border:1px solid var(--gold);border-radius:12px;padding:8px 16px;box-shadow:0 0 22px rgba(255,210,78,.45);animation:slidein .4s ease-out;display:flex;gap:10px;align-items:center;max-width:calc(100% - 28px)}
.toastc b{color:var(--gold)}
@keyframes slidein{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}

/* ---- sheets (players / admin) ---- */
.sheet{position:absolute;top:100px;left:50%;transform:translateX(-50%);width:min(380px,calc(100% - 24px));max-height:calc(100% - 250px);overflow-y:auto;background:rgba(8,11,24,.96);border:1px solid #2b6a8f;border-radius:14px;padding:12px;z-index:3;touch-action:pan-y;text-align:right}
.sheet h3{margin:0;font-size:18px;text-shadow:0 0 12px var(--cyan)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .x{padding:2px 10px;font-size:16px}
.sheet .sec{color:var(--muted);font-size:13px;margin:12px 0 6px}
.sheet button{font-size:15px;padding:8px 12px;margin:3px}
.sheet button.on{background:#17618a;border-color:#9ff6ff;box-shadow:0 0 12px var(--cyan)}
.sheet input[type=text],.sheet input[type=number]{background:var(--panel2);color:var(--text);border:1px solid #2b6a8f;border-radius:8px;padding:8px 10px;font-size:15px;font-family:inherit;-webkit-user-select:text;user-select:text}
.sheet .line{display:flex;gap:6px;align-items:center}
.sheet .line input{flex:1;min-width:0}
.row{display:flex;gap:8px;align-items:center;padding:8px 6px;border-top:1px solid #1b3a62;flex-wrap:wrap}
.row .dot{width:9px;height:9px;border-radius:50%;background:#456;flex:none}
.row .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.row .nm{flex:1;min-width:90px;font-size:15px}
.row .lv{color:var(--muted);font-size:13px}
.row .tag{color:var(--gold);font-size:12px;border:1px solid var(--gold);border-radius:6px;padding:0 5px;margin-inline-start:6px}
.row button{padding:4px 9px;font-size:13px;margin:0}

/* ---- main menu ---- */
#menu>:first-child{margin-top:auto}#menu>:last-child{margin-bottom:auto}
#menu{z-index:5;display:flex;align-items:center;justify-content:flex-start;flex-direction:column;text-align:center;padding:16px;overflow-y:auto;background:linear-gradient(180deg,rgba(6,8,26,0) 0%,rgba(6,8,26,.5) 100%);touch-action:pan-y}
.mwrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(380px,100%);margin:auto}
.chip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.logo{white-space:nowrap;font-size:clamp(38px,11vw,58px);letter-spacing:.14em;margin:6px 0 0;font-weight:900;position:relative;color:#fff;text-shadow:0 0 22px var(--cyan),0 0 44px rgba(179,76,255,.6);animation:flick 5s infinite;padding-inline-start:.14em}
.logo::before,.logo::after{content:attr(data-t);position:absolute;inset:0;padding-inline-start:.14em;pointer-events:none}
.logo::before{color:var(--pink);mix-blend-mode:screen;animation:gl1 3.2s infinite steps(1)}
.logo::after{color:var(--cyan);mix-blend-mode:screen;animation:gl2 3.2s infinite steps(1)}
@keyframes gl1{0%,92%,100%{transform:none;clip-path:inset(0 0 100% 0)}93%{transform:translate(-4px,0);clip-path:inset(20% 0 55% 0)}96%{transform:translate(3px,0);clip-path:inset(60% 0 10% 0)}}
@keyframes gl2{0%,90%,100%{transform:none;clip-path:inset(0 0 100% 0)}91%{transform:translate(4px,0);clip-path:inset(50% 0 20% 0)}95%{transform:translate(-3px,0);clip-path:inset(10% 0 65% 0)}}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.8}98%{opacity:1}99%{opacity:.7}}
.tagline{color:var(--muted);letter-spacing:.2em;font-size:13px;margin:0}
.btn-primary{width:100%;padding:16px 20px;font-size:22px;font-weight:bold;background:linear-gradient(135deg,#1479b8,#6a2bd6);border:1px solid #9ff6ff;box-shadow:0 0 26px rgba(78,234,255,.45),inset 0 0 18px rgba(255,255,255,.12);position:relative;overflow:hidden}
.btn-primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 3.4s infinite}
@keyframes sheen{0%{left:-60%}55%,100%{left:130%}}
.btn-primary:hover{background:linear-gradient(135deg,#1a93de,#7d3bf0);transform:scale(1.02)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mbtn{padding:12px 8px;font-size:16px;position:relative;background:linear-gradient(180deg,rgba(20,50,96,.9),rgba(12,28,60,.9))}
.mbtn:hover{box-shadow:0 0 18px rgba(78,234,255,.45)}
.badge{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 10px var(--danger)}
.admtag{color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:2px 10px;font-size:12px}

/* ---- generic full screens (shop, quests, ...) ---- */
.scr{background:rgba(6,8,26,.97);overflow-y:auto;padding:14px 14px 28px;touch-action:pan-y;text-align:center;display:none}
#pause{z-index:6;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(6,8,26,.82);text-align:center;padding:20px}
#pause h2{margin:0 0 8px;font-size:32px;text-shadow:0 0 18px var(--cyan)}
#pause button{width:min(300px,100%)}
#shop{z-index:6}#screen{z-index:7}#settings{z-index:8;flex-direction:column;align-items:center;justify-content:center}
.scr .top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto 10px}
.scr h2{margin:0;font-size:26px;text-shadow:0 0 16px var(--cyan)}
.scr .wrap{max-width:560px;margin:0 auto}
.tabs{display:flex;gap:8px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap}
.tabs button{padding:8px 16px;font-size:15px}
.tabs button.on{background:#17618a;border-color:#9ff6ff;box-shadow:0 0 12px var(--cyan)}
.card{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #2b6a8f;background:var(--panel);border-radius:12px;padding:12px 14px;margin:9px auto;max-width:560px;text-align:right}
.card .grow{flex:1;min-width:0}
.card .nm{font-size:17px;font-weight:bold}
.card .ds{font-size:13px;color:var(--muted);margin-top:3px}
.card .pips{font-size:14px;color:#50f3ff;margin-top:4px;letter-spacing:2px}
.card button{padding:9px 14px;font-size:15px;white-space:nowrap}
.card.done{border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,78,.25)}
.card.me{border-color:var(--cyan);box-shadow:0 0 14px rgba(78,234,255,.3)}
.ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#17618a,#4a1d9a);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;border:1px solid var(--line)}
.bar{height:8px;border-radius:5px;background:#0a1a36;overflow:hidden;margin-top:7px;border:1px solid #1b3a62}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4eeaff,#b34cff)}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:560px;margin:0 auto}
.sk{border:1px solid #2b6a8f;background:var(--panel);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sk.eq{border-color:var(--gold);box-shadow:0 0 16px rgba(255,210,78,.4)}
.sk canvas{position:static;width:60px;height:72px}
.sk .nm{font-weight:bold;font-size:15px}.sk .ds{font-size:12px;color:var(--muted)}
.sk button{width:100%;padding:7px 6px;font-size:14px}
.rank{width:30px;text-align:center;font-weight:bold;color:var(--gold)}

/* ---- settings ---- */
#settings{background:rgba(6,8,26,.97)}
#settings h2{font-size:30px;margin:0 0 16px;text-shadow:0 0 18px var(--cyan)}
#settings .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
#settings .opt{min-width:150px}
#settings .opt.sel{background:#17618a;border-color:#9ff6ff;box-shadow:0 0 14px var(--cyan)}
#settings input[type=range]{width:200px;accent-color:#4eeaff}

@media (max-width:420px){#hud{font-size:12px}.pill{padding:4px 9px}.hide-s{display:none}.logo{letter-spacing:.08em}}
@media (prefers-reduced-motion:reduce){#note{transition:none}.logo,.logo::before,.logo::after,.btn-primary::after,.toastc{animation:none}}

/* ---- מודולים (2.1) ---- */
#photoBar{position:absolute;left:0;right:0;bottom:0;z-index:9;padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(4,6,20,.92),rgba(4,6,20,.55));display:flex;flex-direction:column;gap:6px;align-items:center}
#photoBar .prow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:560px}
#photoBar button{padding:7px 11px;font-size:14px}
#photoBar button.shot{background:linear-gradient(135deg,#1479b8,#6a2bd6);font-weight:bold;font-size:16px;padding:9px 18px}
#photoBar input[type=range]{width:110px}
#xchat .row{display:flex;gap:4px;align-items:center;margin:3px 0;font-size:14px}
#xchat{top:auto;bottom:70px;max-height:55%}
</style>

<div id="stage">
 <canvas id="game"></canvas>

 <div id="hud">
  <span class="pill c1" id="pLevel"><span class="dotw" id="wdot"></span><span id="level">שלב 1</span></span>
  <span class="pill c2" id="pCoins"><span class="coin"></span><span id="coins">0</span></span>
  <span class="pill c3" id="lives">♥ 3</span>
 </div>

 <div id="bar">
  <button class="ib" id="btnPause" aria-label="השהיה">❚❚</button>
  <button class="ib" id="btnSound" aria-label="צליל">♪</button>
  <button class="ib" id="btnPlayers" hidden aria-label="שחקנים">☰</button>
  <button class="ib" id="btnAdmin" hidden aria-label="אדמין">⚙</button>
  <button class="ib" id="btnKill" hidden aria-label="הכנע בוס">☠</button>
  <span class="pill" id="scoreP">ניקוד 0</span>
  <span class="pill" id="slowP" hidden>⏱ E</span>
 </div>

 <div id="panel" class="sheet" hidden>
  <div class="hd"><h3>שחקנים באונליין</h3><button class="x" data-close="panel" aria-label="סגור">✕</button></div>
  <div class="sec">הבעה</div>
  <div id="emotes"></div>
  <div class="sec">הודעה קצרה (מעל הדמות שלך)</div>
  <div class="line"><input type="text" id="sayInput" maxlength="40" placeholder="כתוב משהו..." autocomplete="off"><button id="saySend">שלח</button></div>
  <div class="sec" id="listHead">מי כאן</div>
  <div id="plist"></div>
 </div>

 <div id="apanel" class="sheet" hidden>
  <div class="hd"><h3>כלי אדמין</h3><button class="x" data-close="apanel" aria-label="סגור">✕</button></div>
  <div class="sec">יכולות</div>
  <div id="toggles"></div>
  <div class="sec">מטבעות ושדרוגים</div>
  <div id="ptsBtns"></div>
  <div class="sec">שלבים ובוסים</div>
  <div class="line"><input type="number" id="jumpInput" min="1" max="1000" value="1" inputmode="numeric"><button id="jumpGo">קפוץ לשלב</button></div>
  <div><button id="tpGoal">טלפורט לשער</button><button id="killBoss">הכנע בוס</button></div>
 </div>

 <div id="note" role="status"></div>
 <div id="toasts"></div>
 <div id="help">A / D או חצים – תנועה | רווח / W – קפיצה | E – האטת זמן | P – השהיה | R – שלב מחדש</div>

 <div id="touch">
  <div class="grp">
   <button class="tb" data-key="ArrowLeft" aria-label="שמאלה">◀</button>
   <button class="tb" data-key="ArrowRight" aria-label="ימינה">▶</button>
  </div>
  <div class="grp col">
   <button class="tb sm" data-key="ArrowDown" id="tdown" hidden aria-label="למטה">▼</button>
   <div class="grp">
    <button class="tb sm" data-key="KeyE" id="tslow" aria-label="האטת זמן">⏱</button>
    <button class="tb big" data-key="Space" aria-label="קפיצה">▲</button>
   </div>
  </div>
 </div>

 <div id="menu" class="overlay"></div>
 <div id="pause" class="overlay"></div>
 <div id="shop" class="overlay scr"></div>
 <div id="screen" class="overlay scr"></div>
 <div id="settings" class="overlay scr"></div>
</div>
<script>
"use strict";
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const stage=document.getElementById("stage");
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Number(n).toLocaleString("he-IL");
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){
 return function(){
  a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;
 };
}
function rr(c,x,y,w,h,r){
 r=Math.min(r,w/2,h/2);
 c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
 c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
 c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}

/* ===================== קבועים ===================== */
const PW=480;                 // רוחב לוגי קבוע: כל השחקנים רואים את אותו שלב
const LEVELS=1000, CHECKPOINT=10, SHOP_EVERY=5;

const WORLDS=[
 {id:"space",name:"עולם החלל",bg:["#0d1538","#05070f"],plat:["#1b3a62","#4eeaff"],haz:["#ff315f","#ff9aa9"],acc:"#4eeaff",grav:.92,mood:"space"},
 {id:"lava", name:"עולם הלבה",bg:["#2d0b08","#0d0302"],plat:["#4a2418","#ff7a2e"],haz:["#ffb020","#fff0a0"],acc:"#ff7a2e",extraHaz:2,mood:"lava"},
 {id:"ice",  name:"עולם הקרח",bg:["#0f2e46","#06121f"],plat:["#2b5f86","#bff2ff"],haz:["#8fd8ff","#ffffff"],acc:"#bff2ff",slip:true,mood:"ice"},
 {id:"cyber",name:"עולם הסייבר",bg:["#10032a","#04010c"],plat:["#2a1050","#39ff88"],haz:["#ff2bd6","#ffd0f7"],acc:"#39ff88",patrol:true,mood:"cyber"}
];
var xWorldShift=0;
const worldOf=n=>WORLDS[(Math.floor(n/10)+xWorldShift)%4];
const isBossLevel=n=>(n+1)%10===0;

const SKINS=[
 {id:"neon",   name:"ניאון",   price:0,   shape:"robot",body:"#ffffff",vis:"#4eeaff",glow:"#4eeaff",trail:"neon",   fx:"שובל ניאון"},
 {id:"ember",  name:"גחלת",    price:150, shape:"robot",body:"#ffd2a8",vis:"#ff5a1f",glow:"#ff7a2e",trail:"fire",   fx:"שובל אש"},
 {id:"frost",  name:"כפור",    price:220, shape:"blob", body:"#e7fbff",vis:"#2a8fd0",glow:"#8fe3ff",trail:"snow",   fx:"פתיתי שלג"},
 {id:"void",   name:"אסטרונאוט",price:320,shape:"astro",body:"#cdb4ff",vis:"#b34cff",glow:"#b34cff",trail:"stars",  fx:"אבק כוכבים"},
 {id:"matrix", name:"מטריקס",  price:420, shape:"robot",body:"#0e3a22",vis:"#39ff88",glow:"#39ff88",trail:"glitch", fx:"גליץ' דיגיטלי"},
 {id:"slime",  name:"סליים",   price:520, shape:"blob", body:"#9dff6a",vis:"#1c5a10",glow:"#9dff6a",trail:"drip",   fx:"טיפות סליים"},
 {id:"gold",   name:"זהב",     price:900, shape:"astro",body:"#ffe27a",vis:"#8a5a00",glow:"#ffd24e",trail:"sparkle",fx:"נצנצי זהב"},
 {id:"rainbow",name:"קשת",     price:1500,shape:"blob", body:"hue",    vis:"#ffffff",glow:"hue",    trail:"rainbow",fx:"שובל קשת"}
];

function ensureDaily(){
 const ds=todayStr();
 if(daily.date===ds&&daily.q.length===3)return;
 const rng=mulberry32(hash("px-"+ds));
 const pool=QPOOL.filter(q=>!q.need||q.need());
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const q=pool.slice(0,3).map(p=>{const tier=Math.floor(rng()*3);return {id:p.id,t:p.t[tier],r:p.r[tier]}});
 daily={date:ds,q,prog:{},claimed:{},bonus:false};
}
function dq(id,n){
 ensureDaily();
 if(daily.q.some(q=>q.id===id))daily.prog[id]=(daily.prog[id]||0)+n;
}
function msToMidnight(){const d=new Date();const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);return m-d}
function questsReady(){
 ensureDaily();
 let n=0;
 for(const q of daily.q)if((daily.prog[q.id]||0)>=q.t&&!daily.claimed[q.id])n++;
 if(daily.q.every(q=>daily.claimed[q.id])&&!daily.bonus)n++;
 return n;
}

const SND={ac:null,master:null,mus:null,sfx:null,mood:"menu",timer:0,step:0,next:0,nb:null};
function audioInit(){
 if(SND.ac){if(SND.ac.state==="suspended")SND.ac.resume().catch(()=>{});return}
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ac=new AC();SND.ac=ac;
  SND.master=ac.createGain();SND.master.connect(ac.destination);
  SND.mus=ac.createGain();SND.mus.connect(SND.master);
  SND.sfx=ac.createGain();SND.sfx.connect(SND.master);
  const len=ac.sampleRate;SND.nb=ac.createBuffer(1,len,ac.sampleRate);
  const ch=SND.nb.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  audioApply();startMusic();
 }catch(e){SND.ac=null}
}
function audioApply(){
 if(!SND.ac)return;
 SND.master.gain.value=settings.vol;
 SND.mus.gain.value=settings.music?.45:0;
 SND.sfx.gain.value=settings.sfx?1:0;
}
function tone(f,t,d,type,g,dest,f2){
 const ac=SND.ac,o=ac.createOscillator(),gn=ac.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
 gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+.012);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(gn);gn.connect(dest);o.start(t);o.stop(t+d+.03);
}
function noiseHit(t,d,g,dest,hp){
 const ac=SND.ac,s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();
 s.buffer=SND.nb;f.type=hp?"highpass":"lowpass";f.frequency.value=hp||800;
 gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(f);f.connect(gn);gn.connect(dest);s.start(t);s.stop(t+d+.02);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function sfx(name,a){
 if(!SND.ac||!settings.sfx)return;
 try{
  const t=SND.ac.currentTime,d=SND.sfx;
  switch(name){
   case"jump":tone(300,t,.14,"square",.07,d,640);break;
   case"air":tone(420,t,.12,"triangle",.09,d,900);break;
   case"land":noiseHit(t,.09,clamp((a||5)/14,.1,.45),d,0);tone(110,t,.1,"sine",.12,d,60);break;
   case"coin":{const p=Math.min(8,a||0);tone(mf(83+p),t,.07,"square",.06,d);tone(mf(90+p),t+.06,.12,"square",.06,d);break}
   case"orb":tone(mf(76),t,.1,"triangle",.1,d);tone(mf(83),t+.07,.1,"triangle",.1,d);tone(mf(88),t+.14,.16,"triangle",.1,d);break;
   case"hit":noiseHit(t,.25,.4,d,0);tone(200,t,.25,"sawtooth",.12,d,50);break;
   case"shield":tone(mf(72),t,.18,"sine",.14,d,mf(84));break;
   case"slow":tone(700,t,.35,"sawtooth",.06,d,120);break;
   case"bhit":noiseHit(t,.2,.35,d,0);tone(160,t,.3,"square",.14,d,70);tone(mf(79),t+.05,.2,"square",.07,d);break;
   case"bdie":noiseHit(t,.8,.5,d,0);tone(240,t,.9,"sawtooth",.14,d,30);for(let i=0;i<5;i++)tone(mf(72+i*4),t+.55+i*.08,.3,"triangle",.1,d);break;
   case"shoot":tone(520,t,.1,"sawtooth",.04,d,200);break;
   case"buy":tone(mf(79),t,.08,"square",.07,d);tone(mf(86),t+.07,.14,"square",.07,d);break;
   case"click":tone(660,t,.04,"square",.04,d);break;
   case"ach":[72,76,79,84].forEach((m,i)=>tone(mf(m),t+i*.09,.25,"triangle",.12,d));break;
   case"win":[72,76,79,84,88].forEach((m,i)=>tone(mf(m),t+i*.1,.3,"square",.07,d));break;
   case"warp":tone(200,t,.5,"sine",.1,d,1200);break;
  }
 }catch(e){}
}
const MOODS={
 menu: {bpm:100,base:57,roots:[0,-4,-2,-7],wave:"triangle",hat:1},
 space:{bpm:104,base:57,roots:[0,-4,-2,-5],wave:"triangle",hat:1},
 lava: {bpm:128,base:52,roots:[0,-2,-4,-7],wave:"sawtooth",hat:1},
 ice:  {bpm:84, base:62,roots:[0,-5,-3,-7],wave:"sine",hat:0},
 cyber:{bpm:132,base:55,roots:[0,3,-2,-4],wave:"square",hat:1},
 boss: {bpm:150,base:47,roots:[0,0,-2,-1],wave:"sawtooth",hat:1}
};
const ARP=[0,2,1,2,0,2,3,2,1,2,0,2,3,2,1,3];
function scheduleStep(s,t,m,dur){
 const ch=Math.floor((s%64)/16),root=m.base+m.roots[ch],tones=[0,3,7,12];
 const n=root+tones[ARP[s%16]];
 tone(mf(n+12),t,dur*1.7,m.wave,m.wave==="square"?.035:.06,SND.mus);
 if(s%8===0||s%8===6)tone(mf(root-12),t,dur*3,"square",.07,SND.mus);
 if(s%8===0)tone(140,t,.16,"sine",.22,SND.mus,45);
 if(m.hat&&s%2===1)noiseHit(t,.04,.05,SND.mus,6000);
 if(s%16===12)noiseHit(t,.09,.08,SND.mus,2500);
}
function musicTick(){
 const ac=SND.ac;if(!ac)return;
 if(!settings.music){SND.next=ac.currentTime+.05;return}
 const m=MOODS[SND.mood]||MOODS.menu,dur=60/m.bpm/4;
 if(SND.next<ac.currentTime-1)SND.next=ac.currentTime+.05;
 while(SND.next<ac.currentTime+.25){scheduleStep(SND.step,SND.next,m,dur);SND.next+=dur;SND.step++}
}
function startMusic(){if(SND.timer||!SND.ac)return;SND.next=SND.ac.currentTime+.1;SND.timer=setInterval(musicTick,60)}
function setMood(n){SND.mood=n}

function createLevel(){
 if(run1("level.override"))return;
 const n=level,wd=worldOf(n);
 const rng=mulberry32((n+1)*7919+12345);
 const rows=12+Math.min(18,Math.floor(n/30));
 SP=105+Math.min(20,Math.floor(n/40));
 const widthF=Math.max(.6,1-n/1500)*(settings.comfy?1.25:1);
 const pw=Math.min(170,PW*.32)*widthF;
 const maxGap=70+Math.min(45,n*.08);

 groundY=150+(rows+1)*SP;
 worldH=groundY+55;
 particles=[];bullets=[];boss=null;
 player={x:0,y:0,vx:0,vy:0,w:30,h:38,ground:false,airJumps:up.dj,sq:1,face:1};
 spawn();
 inv=0;levelHit=false;levelCoins=0;levelOrbs=0;combo=0;comboT=0;

 platforms=[{x:0,y:groundY,w:PW,h:55}];
 for(let i=1;i<=rows;i++){
  const prev=platforms[i-1];
  const lo=Math.max(0,prev.x-pw-maxGap);
  const hi=Math.min(PW-pw,prev.x+prev.w+maxGap);
  platforms.push({x:lo+rng()*Math.max(0,hi-lo),y:groundY-i*SP,w:pw,h:18});
 }
 const fw=Math.min(240,PW*.5);
 const top={x:(PW-fw)/2,y:150,w:fw,h:18};
 platforms.push(top);

 orbs=[1,2,3,4].map(k=>{
  const p=platforms[Math.ceil(rows*k/4)];
  return {x:p.x+p.w/2,y:p.y-42,taken:false};
 });

 const cand=[];
 for(let gx=PW*.28;gx<=PW-70;gx+=110)cand.push({x:gx+(rng()-.5)*30,y:groundY-30,lo:0,hi:PW});
 for(let i=1;i<=rows;i++){
  const p=platforms[i];
  if(p.w>=95)cand.push({x:p.x+8+rng()*(p.w-51),y:p.y-30,lo:p.x,hi:p.x+p.w});
 }
 for(let i=cand.length-1;i>0;i--){
  const j=Math.floor(rng()*(i+1));
  [cand[i],cand[j]]=[cand[j],cand[i]];
 }
 const hc=Math.min(cand.length,2+Math.floor(n/12)+(wd.extraHaz||0));
 const r2=mulberry32((n+1)*104729+7);
 hazards=cand.slice(0,hc).map(c=>{
  const h={x:c.x,y:c.y,w:35,h:30,cx:c.x,amp:0,ph:r2()*6,sp:.035+r2()*.02};
  if(wd.patrol)h.amp=Math.max(0,Math.min(34,c.x-c.lo-3,c.hi-(c.x+35)-3));
  return h;
 });

 coinsL=[];
 for(let i=1;i<=rows;i++){
  const p=platforms[i],q=platforms[i-1];
  coinsL.push({x:p.x+p.w*(.3+r2()*.4),y:p.y-32,v:1,taken:false,ph:r2()*6});
  coinsL.push({x:(p.x+p.w/2+q.x+q.w/2)/2,y:(p.y+q.y)/2-22,v:1,taken:false,ph:r2()*6});
  if(i%4===0)coinsL.push({x:p.x+p.w/2,y:p.y-48,v:5,taken:false,ph:r2()*6});
 }
 for(let j=0;j<4;j++)coinsL.push({x:PW*(.2+.2*j),y:groundY-30,v:1,taken:false,ph:r2()*6});
 coinTotalL=coinsL.length;orbTotalL=orbs.length;

 goal={x:top.x+top.w/2-22,y:top.y-70,w:45,h:70,locked:false};

 const bl=isBossLevel(n);
 if(bl){
  const kk=(n+1)/10;
  boss={x:PW/2-42,y:0,w:84,h:62,cy:150+SP*2.3,t:0,hp:3+Math.min(4,Math.floor(kk/3)),max:0,inv:0,cd:90,spd:1+Math.min(.8,kk*.05),dead:false,dying:0,name:["עין הנבולה","גולם המגמה","ווירם הכפור","ליבת הגליץ'"][Math.floor(n/10)%4],kk};
  boss.max=boss.hp;
  boss.rate=Math.max(55,110-kk*3);
  goal.locked=true;
 }
 setMood(bl?"boss":wd.mood);
 const wi=Math.floor(n/10)%4;
 banner={t:150,title:"שלב "+(n+1),sub:bl?"בוס: "+boss.name:(wi!==lastWorld||n%10===0?wd.name:"")};
 lastWorld=wi;
 camY=Math.min(worldH-Hl,Math.max(0,player.y-Hl*.55));
 levelStartFrame=frame;
 run("level",n,wd,r2);
 updateHUD();
}

/* ===================== אפקטים ===================== */
function pt(x,y,vx,vy,life,color,size,type,g){
 particles.push({x,y,vx,vy,life,max:life,color,size:size||4,type:type||"r",g:g||0});
 if(particles.length>700)particles.splice(0,120);
}
function burst(x,y,color,n,sp,size){
 n=n||14;sp=sp||7;
 for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp;pt(x,y,Math.cos(a)*s,Math.sin(a)*s,26+Math.random()*16,color,size||4,"r",.14)}
}
function popText(x,y,txt,color){particles.push({x,y,vx:0,vy:-.9,life:52,max:52,color:color||"#ffd24e",size:15,type:"t",txt,g:0})}
function ringFx(x,y,color,r){pt(x,y,0,0,20,color,r||26,"ring")}
function jumpFx(air){
 const x=player.x+15,y=player.y+player.h;
 ringFx(x,y,air?"#b9f4ff":"rgba(255,255,255,.8)",air?34:24);
 for(let i=0;i<(air?8:6);i++)pt(x+(Math.random()-.5)*16,y-2,(Math.random()-.5)*3,-Math.random()*1.2,22,air?"#b9f4ff":"#aeb8d8",3,"c",.03);
 player.sq=1.28;
}
function landFx(vy){
 const x=player.x+15,y=player.y+player.h,p=clamp(vy/12,.2,1);
 for(let i=0;i<Math.round(6+8*p);i++){const d=Math.random()<.5?-1:1;pt(x+d*8,y-2,d*(1+Math.random()*3.2*p),-Math.random()*1.5*p,24,"#aeb8d8",3,"c",.05)}
 ringFx(x,y,"rgba(255,255,255,.6)",18+20*p);
 player.sq=.72+.18*(1-p);
 sfx("land",vy);
 if(vy>11)shake=Math.max(shake,3);
}
function trailFx(flying){
 if(frame%2)return;
 const sk=skinById(skins.eq),cx=player.x+15,cy=player.y+player.h-6,r=(a,b)=>a+Math.random()*(b-a);
 const moving=Math.abs(player.vx)>1.2||!player.ground||flying;
 if(!moving)return;
 switch(sk.trail){
  case"neon":pt(cx+r(-8,8),cy,0,0,14,"#4eeaff",3,"c");break;
  case"fire":pt(cx+r(-7,7),cy,r(-.3,.3),r(-1.2,-.5),22,["#ff7a2e","#ffd24e","#ff4a1f"][Math.floor(Math.random()*3)],r(3,7),"c");break;
  case"snow":pt(cx+r(-9,9),cy-8,r(-.4,.4),r(.1,.5),34,"#e7fbff",r(2,4),"c");break;
  case"stars":pt(cx+r(-9,9),cy-8,r(-.6,.6),r(-.6,.6),30,Math.random()<.5?"#cdb4ff":"#ffffff",r(3,5),"s");break;
  case"glitch":pt(cx+r(-14,14),player.y+r(0,38),0,0,12,"#39ff88",r(3,8),"r");break;
  case"drip":pt(cx+r(-7,7),cy,0,r(.1,.6),30,"#9dff6a",r(2,4),"c",.15);break;
  case"sparkle":pt(cx+r(-9,9),player.y+r(0,38),r(-.3,.3),r(-.5,.1),26,"#ffd24e",r(3,5),"s");break;
  case"rainbow":pt(cx+r(-6,6),cy,r(-.3,.3),r(-.3,.3),28,"hsl("+((tNow*.2+Math.random()*60)%360|0)+",90%,62%)",5,"c");break;
 }
}
function fxHit(shielded){
 const x=player.x+15,y=player.y+19;
 burst(x,y,shielded?"#6bffb0":"#ff466b",shielded?16:22,7,4);
 ringFx(x,y,shielded?"#6bffb0":"#ff466b",36);
 shake=Math.max(shake,shielded?5:10);
}

/* ===================== פגיעות ===================== */
function takeHit(resp){
 if(inv>0||(isAdmin&&(cheat.god||cheat.fly)))return false;
 levelHit=true;
 if(shield>0){shield--;inv=90;updateHUD();fxHit(true);sfx("shield");return true}
 fxHit(false);sfx("hit");run("hit");
 if(!(isAdmin&&cheat.inf)){
  lives--;updateHUD();
  if(lives<=0){gameOver();return true}
 }
 inv=90;
 if(resp)spawn();else{player.vy=-8;player.vx=(player.x<PW/2?1:-1)*5}
 return true;
}

/* ===================== בוס ===================== */
function updateBoss(k){
 const b=boss;if(!b)return;
 if(b.dead){return}
 if(b.dying>0){
  b.dying--;
  if(frame%3===0)burst(b.x+Math.random()*b.w,b.y+Math.random()*b.h,["#ffd24e","#ff7a2e","#fff"][Math.floor(Math.random()*3)],8,6,5);
  if(b.dying===0){b.dead=true;shake=14}
  return;
 }
 b.t+=k;
 b.x=PW/2-b.w/2+Math.sin(b.t*.012*b.spd)*(PW/2-b.w/2-8);
 b.y=b.cy+Math.sin(b.t*.021*b.spd)*52-b.h/2;
 if(b.inv>0)b.inv-=1;
 b.cd-=k;
 if(b.cd<=0&&Math.abs(player.y-b.y)<620){
  b.cd=b.rate;
  const sx=b.x+b.w/2,sy=b.y+b.h*.6,px=player.x+15,py=player.y+19;
  let a0=Math.atan2(py-sy,px-sx);
  const spread=b.hp<=Math.ceil(b.max/2)?[-.35,0,.35]:[0];
  const sp=Math.min(4.6,2.5+b.kk*.08);
  for(const d of spread)bullets.push({x:sx,y:sy,vx:Math.cos(a0+d)*sp,vy:Math.sin(a0+d)*sp,life:300});
  sfx("shoot");
 }
 run("boss",b,k);
 const hb={x:b.x+6,y:b.y+4,w:b.w-12,h:b.h-8};
 if(b.inv===0&&!(isAdmin&&cheat.fly)&&collide(player,hb)){
  const feet=player.y+player.h;
  if(player.vy>1&&feet-player.vy*2<=b.y+b.h*.5){
   b.hp--;b.inv=70;
   player.vy=-12;player.airJumps=up.dj;player.sq=1.2;
   burst(player.x+15,b.y,"#ffd24e",18,7,4);ringFx(player.x+15,b.y,"#fff",40);
   shake=Math.max(shake,9);sfx("bhit");
   if(b.hp<=0)bossKill();
  }else takeHit(false);
 }
}
function bossKill(){
 const b=boss;if(!b||b.dying>0||b.dead)return;
 b.dying=70;bullets=[];
 const n=addCoins(40+Math.round(b.kk*10));
 score+=500;stats.bosses++;dq("boss",1);
 goal.locked=false;
 run("bossdie",b);
 popText(b.x+b.w/2,b.y,"+"+n+" מטבעות","#ffd24e");
 sfx("bdie");
 checkAch();save();updateHUD();
}
function updateBullets(k){
 for(const b of bullets){
  if(b.g)b.vy+=b.g*k;
  b.x+=b.vx*k;b.y+=b.vy*k;b.life-=k;
  if(frame%4===0)pt(b.x,b.y,0,0,12,"#ff6ad5",4,"c");
  if(collide(player,{x:b.x-6,y:b.y-6,w:12,h:12})){b.life=0;takeHit(false)}
 }
 bullets=bullets.filter(b=>b.life>0&&b.y<worldH+60&&b.y>-200&&b.x>-40&&b.x<PW+40);
}

/* ===================== האטת זמן ===================== */
function useSlow(){
 if(!playing||paused||up.slow<1||slow.t>0||slow.cd>0)return;
 const dur=(3+up.slow)*60,cool=Math.max(420,1000-up.slow*160);
 slow.t=dur;slow.cd=dur+cool;stats.slow++;
 sfx("slow");ringFx(player.x+15,player.y+19,"#4eeaff",60);
 checkAch();
}

/* ===================== עדכון ===================== */
function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(){
 if(!playing||paused)return;
 const flying=isAdmin&&cheat.fly;
 const wd=worldOf(level);
 if(slow.t>0)slow.t--;
 if(slow.cd>0)slow.cd--;
 const k=slow.t>0?.45:1;
 const spd=(isAdmin&&cheat.fast)?1.8:1;
 const ice=!!wd.slip&&player.ground;
 const accel=.85*(1+.12*up.speed)*spd*(ice?.8:1)*RB.speed;
 const maxV=(6.5+.7*up.speed)*spd*RB.speed;
 const jumpV=13*(1+.07*up.jump)*RB.jump;

 const left=keys.ArrowLeft||keys.KeyA,right=keys.ArrowRight||keys.KeyD;
 if(right)player.vx+=accel*k;
 if(left)player.vx-=accel*k;
 const dIn=ice?.94:.88,dOut=ice?.975:.72;
 player.vx*=Math.pow((left||right)?dIn:dOut,k);
 if(Math.abs(player.vx)<.1)player.vx=0;
 player.vx=clamp(player.vx,-maxV,maxV);
 if(Math.abs(player.vx)>.5)player.face=player.vx>0?1:-1;

 const jumpKey=!!(keys.Space||keys.ArrowUp||keys.KeyW);
 const jumpPressed=jumpKey&&!jumpWas;
 jumpWas=jumpKey;
 if(keys.KeyE||keys.KeyQ){keys.KeyE=false;keys.KeyQ=false;useSlow()}

 if(flying){
  const dn=!!(keys.ArrowDown||keys.KeyS);
  const fv=8*spd;
  if(jumpKey)player.vy=-fv;else if(dn)player.vy=fv;else player.vy*=.8;
  player.x+=player.vx;player.y+=player.vy;
  player.ground=false;
  player.y=clamp(player.y,-150,worldH);
  if(player.x<0){player.x=0;player.vx=0}
  if(player.x+player.w>PW){player.x=PW-player.w;player.vx=0}
 }else{
  if(jumpPressed)jumpBuf=settings.comfy?12:8;else if(jumpBuf>0)jumpBuf--;
  if(player.ground){coyote=settings.comfy?12:7;player.airJumps=up.dj}else if(coyote>0)coyote--;
  if(jumpBuf>0&&coyote>0){
   player.vy=-jumpV;player.ground=false;coyote=0;jumpBuf=0;
   stats.jumps++;dq("jumps",1);jumpFx(false);sfx("jump");
  }else if(jumpPressed&&coyote===0&&!player.ground&&player.airJumps>0){
   player.airJumps--;
   player.vy=-jumpV*.92;jumpBuf=0;
   stats.airJ++;stats.jumps++;dq("jumps",1);jumpFx(true);sfx("air");
  }
  if(!jumpKey&&player.vy<0)player.vy+=.6*k;
  player.vy+=(settings.comfy?.48:.55)*k*GMUL;
  if(WIND&&!player.ground)player.vx+=WIND*k;
  player.vy=Math.min(player.vy,15);

  const oldY=player.y,wasG=player.ground,pvy=player.vy;
  player.x+=player.vx*k;
  player.y+=player.vy*k;
  player.ground=false;

  if(player.x<0){player.x=0;player.vx=0}
  if(player.x+player.w>PW){player.x=PW-player.w;player.vx=0}

  for(const p of platforms){
   if(player.vy>=0&&oldY+player.h<=p.y&&player.y+player.h>=p.y&&player.x+player.w>p.x-6&&player.x<p.x+p.w+6){
    player.y=p.y-player.h;
    player.vy=0;player.ground=true;
   }
  }
  if(player.ground&&!wasG&&pvy>3)landFx(pvy);
 }
 player.sq+=(1-player.sq)*.2;
 trailFx(flying);

 /* מגנט: מושך מטבעות וגבישים */
 const pcx=player.x+15,pcy=player.y+19;
 const R=(up.magnet>0?60+55*up.magnet:0)+RB.magnet;
 const mr=20+up.magnet*40+(settings.comfy?24:0)+(flying?30:0);
 if(comboT>0){comboT--;if(comboT===0)combo=0}
 for(const o of coinsL){
  if(o.taken)continue;
  if(R){
   const dx=pcx-o.x,dy=pcy-o.y,d=Math.hypot(dx,dy);
   if(d<R&&d>1){const s=Math.min(d,3.5+up.magnet*1.2);o.x+=dx/d*s;o.y+=dy/d*s}
  }
  if(Math.hypot(pcx-o.x,pcy-o.y)<(o.v>1?26:21)){
   o.taken=true;levelCoins++;
   combo++;comboT=45;
   const n=addCoins(o.v);
   sfx("coin",combo-1);
   burst(o.x,o.y,o.v>1?"#fff2a0":"#ffd24e",o.v>1?14:7,o.v>1?5:3,3);
   popText(o.x,o.y-10,n>0?"+"+n:"★",o.v>1?"#fff2a0":"#ffd24e");
   if(combo>=4)popText(o.x,o.y-26,"x"+combo,"#ff9a3d");
   updateHUD();
  }
 }
 for(const o of orbs){
  if(o.taken)continue;
  if(R){
   const dx=pcx-o.x,dy=pcy-o.y,d=Math.hypot(dx,dy);
   if(d<R&&d>1){const s=Math.min(d,3+up.magnet);o.x+=dx/d*s;o.y+=dy/d*s}
  }
  if(collide(player,{x:o.x-mr/2,y:o.y-mr/2,w:mr,h:mr})){
   o.taken=true;levelOrbs++;stats.orbs++;dq("orbs",1);
   score+=100;const n=addCoins(2);
   burst(o.x,o.y,"#48efff",18,7,4);ringFx(o.x,o.y,"#48efff",34);
   popText(o.x,o.y-10,"+100","#48efff");sfx("orb");
   updateHUD();
  }
 }

 for(const h of hazards){
  if(h.amp)h.ph+=h.sp*k;
  if(h.amp)h.x=h.cx+Math.sin(h.ph)*h.amp;
 }
 if(inv>0)inv--;
 if(inv===0&&!flying&&!(isAdmin&&cheat.god)){
  const ins=settings.comfy?9:5;
  for(const h of hazards){
   if(collide(player,{x:h.x+ins,y:h.y+ins+1,w:h.w-2*ins,h:h.h-ins-1})){
    if(takeHit(true)&&!playing)return;
    break;
   }
  }
 }
 updateBoss(k);
 updateBullets(k);
 run("update",k);
 if(!playing)return;

 if(player.y>worldH+100){
  inv=0;
  if(!takeHit(true))spawn();
  if(!playing)return;
 }

 if(!goal.locked&&collide(player,goal)){if(!run1("goal"))completeLevel()}

 for(const p of particles){
  p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;
 }
 particles=particles.filter(p=>p.life>0);
 if(shake>0)shake*=.86;
 if(shake<.3)shake=0;
}

function completeLevel(){
 run("complete");
 const n=addCoins(5+Math.floor(level/10));
 score+=250;stats.levels++;dq("levels",1);
 if(!levelHit){stats.nohit++;dq("nohit",1)}
 if(levelCoins>=coinTotalL&&levelOrbs>=orbTotalL)stats.perfect++;
 for(let i=0;i<40;i++)pt(goal.x+22,goal.y+30,(Math.random()-.5)*9,-Math.random()*8,40+Math.random()*20,["#b34cff","#4eeaff","#ffd24e","#fff"][i%4],4,"r",.2);
 popText(goal.x+22,goal.y-8,"+"+n+" מטבעות","#ffd24e");
 sfx("warp");
 level++;best=Math.max(best,level);
 checkAch();save();submitScore();
 if(level>=LEVELS){victory();return}
 if(level%SHOP_EVERY===0){
  playing=false;updateHUD();
  openShop("שלב "+level+" הושלם!","לשלב הבא",nextLevel);
 }else nextLevel();
}

/* ===================== רשת: שליחת מצב השחקן ===================== */
let lastNet="";
function skinColor(id){const s=skinById(id);return s.glow==="hue"?"#ff6ad5":s.glow}
function netTick(){
 if(!roomCap)return;
 const o=(playing&&player)?{play:true,lvl:level,x:Math.round(player.x),y:Math.round(player.y),f:(isAdmin&&cheat.fly)?1:0,k:skins.eq,c:skinColor(skins.eq),gr:xGearApi.code()}:{play:false};
 const key=JSON.stringify(o);
 if(key===lastNet)return;

 else{pct=100;txt="⏱ E מוכן"}
 pct=Math.round(clamp(pct,0,100));
 const key=mode+":"+pct;
 if(key===lastSlowUI)return;

 $("tslow").style.setProperty("--cd",pct+"%");

function openShop(title,btnLabel,onDone,tab){
 shopCtx=onDone?"between":"menu";
 keys={};
 if(tab)shopTab=tab;

 const render=()=>{
  shop.replaceChildren();

  }

    b.disabled=eq||(!owned&&coins<sk.price);
    b.onclick=()=>{
     if(!owned){coins-=sk.price;skins.owned.push(sk.id);stats.buys++;sfx("buy")}
     skins.eq=sk.id;sfx("buy");checkAch();save();updateHUD();render();
    };
    card.append(cv,el("div","nm",sk.name),el("div","ds",sk.fx),b);

  }else{

     checkAch();save();updateHUD();render();

function openQuests(){

 rows.sort((a,b)=>(b.me-a.me)||(b.online-a.online)||(b.lvl-a.lvl));

 player.x=stash.px+2;player.y=stash.py-4;player.vx=0;player.vy=0;camY=stash.camY;

hook("goal",()=>{if(inRoom){exitRoom();return true}return false});
hook("gameover",()=>{portal=null;inRoom=false;stash=null;roomChest=null;XG.room=1;return false});
hook("update",k=>{
 if(secCd>0)secCd--;
 if(portal&&!inRoom){
  portal.t+=k;
  const d=Math.hypot(player.x+15-(portal.x+14),player.y+19-(portal.y+23));
  if(d<170&&frame%24===0)pt(portal.x+14+(Math.random()-.5)*20,portal.y+30,0,-.8,34,"#d9a8ff",3,"s");
  if(secCd===0&&collide(player,portal))enterRoom();
 }
 if(inRoom&&roomChest&&!roomChest.open&&collide(player,roomChest)){
  roomChest.open=true;
  const n=stash?level:level;
  const first=!secSt.claimed[n];
  const base=first?40+Math.floor(level/4):10;
  grantCoins(base);
  burst(roomChest.x+17,roomChest.y,"#ffd24e",30,8,5);ringFx(roomChest.x+17,roomChest.y,"#fff",50);
  popText(roomChest.x+17,roomChest.y-14,"+"+base,"#ffd24e");sfx("win");xflash(.3,"#ffd24e");
  if(first){
   secSt.claimed[n]=1;xinc("secrets");
   if(Math.random()<.4)giveRare(level>=30?2:1,"secret");
  }else note("כבר לקחת את הפרס הגדול של החדר הזה. קיבלת בונוס קטן.");
  save();
 }
});

 }

/* ============================================================
   מודול בוסים מיוחדים: לכל עולם יכולת התקפה ייחודית משלו + שלב זעם בחצי חיים + פתיח קולנועי
     עין הנבולה  - טבעת קליעים מתרחבת
     גולם המגמה  - פצצות לבה בקשת
     ווירם הכפור - גשם נטיפי קרח עם אזהרה
     ליבת הגליץ' - קרני לייזר עם סימון מוקדם
   ============================================================ */
const BS={t:0,warn:[],lasers:[],intro:0};
function bossWorld(){return Math.max(0,WORLDS.indexOf(worldOf(level)))}
hook("level",()=>{BS.t=0;BS.warn.length=0;BS.lasers.length=0;BS.intro=boss?150:0});
hook("start",()=>{BS.warn.length=0;BS.lasers.length=0});
function enraged(b){return b.hp<=Math.ceil(b.max/2)}
hook("boss",(b,k)=>{
 if(b.dead||b.dying>0)return;
 BS.t+=k;
 const w=bossWorld(),rg=enraged(b),cx=b.x+b.w/2,cy=b.y+b.h/2;
 if(rg&&!b._rage){b._rage=true;note("⚠ הבוס זועם!");xflash(.35,"#ff3050");shake=Math.max(shake,10)}
 if(w===0){
  b._a=(b._a||160)-k;
  if(b._a<=0){b._a=rg?130:200;const n=rg?12:8,sp=2.3+b.kk*.05;
   for(let i=0;i<n;i++){const a=i/n*6.283+BS.t*.01;bullets.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:240})}
   ringFx(cx,cy,"#ff2bd6",70);sfx("shoot")}
 }else if(w===1){
  b._a=(b._a||140)-k;
  if(b._a<=0){b._a=rg?110:160;const n=rg?5:3;
   for(let i=0;i<n;i++){const d=(i-(n-1)/2);bullets.push({x:cx,y:cy,vx:d*1.5+(Math.random()-.5)*.8,vy:-5.5-Math.random()*1.5,g:.13,life:260})}
   sfx("shoot")}
 }else if(w===2){
  b._a=(b._a||150)-k;
  if(b._a<=0){b._a=rg?150:215;const n=rg?5:4;
   for(let i=0;i<n;i++)BS.warn.push({x:30+Math.random()*(PW-60),t:48+i*6});
   sfx("shoot")}
 }else{
  b._a=(b._a||170)-k;
  if(b._a<=0){b._a=rg?200:270;
   const py=player.y+19;BS.lasers.push({y:Math.round(py/10)*10,t:0,hit:false});
   if(rg)BS.lasers.push({y:Math.round((py-120)/10)*10,t:-14,hit:false});
   sfx("shoot")}
 }
 /* נטיפי קרח: אחרי האזהרה נופלים */
 for(const wn of BS.warn){wn.t-=k;if(wn.t<=0&&!wn.done){wn.done=true;bullets.push({x:wn.x,y:camY-20,vx:0,vy:6.2,g:.05,life:260})}}
 BS.warn=BS.warn.filter(x=>!x.done);
 /* לייזרים: 50 פריימים אזהרה ואז 22 פריימים אש */
 for(const L of BS.lasers){
  L.t+=k;
  if(L.t>50&&L.t<72&&!L.hit&&inv===0&&Math.abs(player.y+19-L.y)<17){L.hit=true;takeHit(false);shake=Math.max(shake,10)}
 }
 BS.lasers=BS.lasers.filter(L=>L.t<76);
});

});

/* ============================================================
   מודול חברתי: צ'אט בין שחקנים (השתקה וחסימה), חברים (מעקב) והתראות התחברות
   הצ'אט עובד דרך חדר חי (room) והוא זמין רק כשהמשחק נפתח מהקישור המשותף.
   "חבר" הוא מעקב חד־צדדי שנשמר אצלך (ללא אישור הדדי) כי אין שרת שמנהל בקשות.
   ============================================================ */
const soc={friends:{},muted:{},blocked:{}};
const chatLog=[];let chatUnread=0,chatOpen=false,lastChatSend=0,lastOnline=null;
defMod({
 id:"social",name:"חברים",icon:"👥",
 load(d){
  for(const k of ["friends","muted","blocked"]){soc[k]={};const s=(d&&d[k])||{};for(const id in s){if(/^u_[A-Za-z0-9_-]{4,40}$/.test(id))soc[k][id]=String(s[id]||"").slice(0,30)}}
 },
 save(){return soc},
 badge:()=>onlineFriends().length,
 open(){openFriends()}
});
xSocial.blocked=id=>!!(id&&soc.blocked[id]);
xSocial.muted=id=>!!(id&&(soc.muted[id]||soc.blocked[id]));
function onlineFriends(){return uniquePeers().filter(p=>p.by&&!p.isMe&&soc.friends[p.by])}
function nm(id){return nameOf(id)!=="שחקן"?nameOf(id):(soc.friends[id]||soc.muted[id]||soc.blocked[id]||"שחקן")}
function addFriend(id){
 if(!id||id===myId)return;
 soc.friends[id]=nameOf(id)!=="שחקן"?nameOf(id):(soc.friends[id]||"חבר");
 xinc("friends");save();note("➕ "+nm(id)+" נוסף לחברים");
}
function setFlag(kind,id,on){
 if(!id||id===myId)return;
 if(on){soc[kind][id]=nameOf(id)!=="שחקן"?nameOf(id):(soc[kind][id]||"שחקן");if(kind==="blocked")delete soc.friends[id]}
 else delete soc[kind][id];
 save();
}

/* ----- כפתורי פעולה לכל שחקן (חלונית שחקנים, צ'אט, מסך חברים) ----- */
function playerActions(id,after){
 const box=el("span");
 const fr=!!soc.friends[id],mu=!!soc.muted[id],bl=!!soc.blocked[id];
 const mk=(t,title,fn)=>{const b=el("button",null,t);b.title=title;b.style.padding="4px 8px";b.style.margin="0 2px";b.onclick=e=>{e.stopPropagation();fn();if(after)after()};return b};
 if(!bl)box.appendChild(mk(fr?"✓":"➕",fr?"הסר חבר":"הוסף חבר",()=>{if(fr){delete soc.friends[id];save()}else addFriend(id)}));
 box.appendChild(mk(mu?"🔊":"🔇",mu?"בטל השתקה":"השתק",()=>{setFlag("muted",id,!mu);note(mu?"השתקה בוטלה":"השחקן הושתק")}));
 box.appendChild(mk(bl?"✔":"⛔",bl?"בטל חסימה":"חסום",()=>{setFlag("blocked",id,!bl);note(bl?"החסימה בוטלה":"השחקן נחסם")}));
 return box;
}
hook("panel.row",(row,r)=>{if(r.id&&!r.me)row.appendChild(playerActions(r.id,renderPanel))});

/* ----- צ'אט ----- */
let chatBox=null;
function buildChat(){
 if(chatBox)return;
 chatBox=el("div","sheet");chatBox.id="xchat";chatBox.hidden=true;
 const hd=el("div","hd");hd.append(el("h3",null,"צ'אט"));
 const x=el("button","x","✕");x.onclick=()=>toggleChat(false);hd.appendChild(x);
 const list=el("div");list.id="xchatList";list.style.maxHeight="38vh";list.style.overflowY="auto";
 const line=el("div","line");
 const inp=document.createElement("input");inp.type="text";inp.id="xchatIn";inp.maxLength=80;inp.placeholder="כתוב הודעה...";inp.autocomplete="off";
 const send=el("button",null,"שלח");send.onclick=sendChat;
 inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendChat()}});
 line.append(inp,send);
 chatBox.append(hd,el("div","note","אפשר להשתיק (🔇) או לחסום (⛔) כל שולח. הצ'אט ציבורי לכל מי שמחובר."),list,line);
 $("stage").appendChild(chatBox);
}
function renderChat(){
 if(!chatBox)return;
 const list=$("xchatList");list.replaceChildren();
 if(!chatLog.length)list.appendChild(el("div","note","עדיין אין הודעות."));
 for(const m of chatLog){
  const row=el("div","row");
  const nmEl=el("span","nm",(m.me?"אתה":nm(m.by))+": ");
  const tx=el("span",null,m.t);tx.style.flex="1";
  row.append(nmEl,tx);
  if(!m.me&&m.by)row.appendChild(playerActions(m.by,renderChat));
  list.appendChild(row);
 }
 list.scrollTop=list.scrollHeight;
}
function toggleChat(on){
 buildChat();
 chatOpen=on===undefined?chatBox.hidden:on;
 chatBox.hidden=!chatOpen;
 if(chatOpen){$("panel").hidden=true;$("apanel").hidden=true;chatUnread=0;renderChat();updateChatBtn()}
}
function updateChatBtn(){
 const b=$("btnChat");if(!b)return;
 b.hidden=!roomCap;
 b.textContent=chatUnread>0?"💬 "+chatUnread:"💬";
}
function sendChat(){
 const inp=$("xchatIn");
 const t=inp.value.replace(/[\u0000-\u001f]/g,"").trim().slice(0,80);
 if(!t||!roomCap)return;
 const now=Date.now();
 if(now-lastChatSend<1200){note("לאט יותר");return}
 lastChatSend=now;inp.value="";
 chatLog.push({me:true,by:myId,t});if(chatLog.length>60)chatLog.shift();
 mySay={text:t.slice(0,40),at:performance.now()};
 roomCap.emit("chat",{t}).catch(()=>note("השליחה נכשלה"));
 roomCap.presence({say:t.slice(0,40),st:Date.now()}).catch(()=>{});
 renderChat();
}
hook("init",()=>{addBarBtn("btnChat","💬","צ'אט",()=>toggleChat());updateChatBtn()});
hook("caps",()=>{
 updateChatBtn();
 if(!roomCap)return;
 roomCap.on("chat",m=>{
  const by=m&&m.by||null,d=m&&m.data;
  if(!d||typeof d.t!=="string")return;
  if(by&&by===myId)return;
  if(xSocial.muted(by))return;
  const t=d.t.replace(/[\u0000-\u001f]/g,"").slice(0,80);if(!t)return;
  chatLog.push({me:false,by,t});if(chatLog.length>60)chatLog.shift();
  if(chatOpen)renderChat();else{chatUnread++;updateChatBtn()}
 },()=>{});
});
hook("peers",()=>{
 updateChatBtn();
 const on=new Set(uniquePeers().filter(p=>p.by&&!p.isMe).map(p=>p.by));
 if(lastOnline){for(const id of on)if(!lastOnline.has(id)&&soc.friends[id])note("👥 "+nm(id)+" התחבר");}
 lastOnline=on;
});

/* ----- מסך חברים ----- */

 showScreen("חברים",wrap=>{

     :"מי מחובר ניתן לראות רק כשהמשחק נפתח מהקישור המשותף. רשימת החברים שלך נשמרת."));
   const sec=t=>{const h=el("div","note",t);h.style.fontWeight="bold";h.style.color="#fff";wrap.appendChild(h)};

   for(const p of peers){

   }

  render();

  screenCleanup=()=>clearInterval(t);

/* ============================================================
   מודול טורניר שבועי: שלב טורניר קבוע לכל השבוע (זהה לכל השחקנים), ניקוד לפי מטבעות, גבישים,
   זמן ובונוס "בלי פגיעות". הניקוד נשמר בענן (db) ויוצר טבלת דירוג. פרס לפי דירוג השבוע שעבר.
   ============================================================ */
const WEEK=7*864e5;
const tq={w:{},claimed:{},runs:0};
let tRun=null;
function weekId(now){return Math.floor((now||Date.now())/WEEK)}
function tourneyLevel(wk){let t=30+((wk*7)%110);if(isBossLevel(t))t++;return t}
function tourneyEnds(){return (weekId()+1)*WEEK-Date.now()}
defMod({
 id:"tourney",name:"טורניר שבועי",icon:"🏆",
 load(d){
  tq.w={};tq.claimed={};tq.runs=0;
  if(d&&typeof d==="object"){
   for(const k in (d.w||{})){if(/^\d{3,6}$/.test(k)){const v=Math.floor(Number(d.w[k]));if(v>0)tq.w[k]=Math.min(v,1e7)}}
   for(const k in (d.claimed||{}))if(/^\d{3,6}$/.test(k))tq.claimed[k]=1;
   tq.runs=Math.max(0,Math.floor(Number(d.runs))||0);
  }
 },
 save(){return tq},
 open(){openTourney()}
});
function pushTourney(){
 if(!dbCap||!myId)return;
 const keep={},cur=weekId();
 for(const k in tq.w)if(cur-Number(k)<=2)keep[k]=tq.w[k];
 dbCap.doc("tourney/"+myId).set({w:keep,skin:skins.eq,t:Date.now()}).catch(()=>{});
}
hook("caps",()=>pushTourney());
async function fetchTourney(){
 if(!dbCap||!userCap)return null;
 const snap=await dbCap.collection("tourney").limit(500).get();
 return snap.docs.map(d=>{const x=d.data()||{};return {id:d.id,w:(x.w&&typeof x.w==="object")?x.w:{},skin:typeof x.skin==="string"?x.skin:"neon"}});
}
function rankFor(rows,wk){
 const list=rows.map(r=>({id:r.id,s:Math.floor(Number(r.w[wk]))||0,skin:r.skin})).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
 return list;
}
async function fetchWeekScores(wk){try{const rows=await fetchTourney();return rows?rankFor(rows,wk):null}catch(e){return null}}

/* ----- ריצה ----- */
function startTourney(){
 const wk=weekId(),tl=tourneyLevel(wk);
 xmode={type:"tourney",wk};
 tRun={wk,tl,t:0,coins0:stats.coinsTotal,orbs0:stats.orbs,hit0:false,done:false};
 closeScreenNoMenu();
 startGame(tl);
 lives=3;updateHUD();
 note("🏆 טורניר: הגע לשער מהר ככל האפשר");
}
function closeScreenNoMenu(){const s=$("screen");s.style.display="none";if(screenCleanup){try{screenCleanup()}catch(e){}screenCleanup=null}menuOn=false}
hook("update",k=>{
 if(!xmode||xmode.type!=="tourney"||!tRun)return;
 tRun.t+=k/60;
 if(levelHit)tRun.hit0=true;

 }

/* ============================================================
   מודול עורך שלבים: מציירים פלטפורמות, מטבעות, מכשולים, שער ונקודת התחלה על קנבס, בודקים ומשחקים.
   שמירה מקומית/בענן (עד 10 שלבים) ושיתוף בקוד טקסט שאפשר להעתיק ולהדביק. שלבים אישיים לא נותנים מטבעות.
   ============================================================ */
const ED={levels:[],cur:null,tool:"plat",pw:130,snap:10};
const ED_H=875,ED_GROUND=820;
function edBlank(){return {n:"השלב שלי",w:0,p:[],c:[],h:[],g:null,s:[40,ED_GROUND-38],ok:false}}
function edClean(o){
 if(!o||typeof o!=="object")return null;
 const num=(v,a,b)=>{v=Math.round(Number(v));return isFinite(v)?Math.max(a,Math.min(b,v)):null};
 const pair=(a,mx,my)=>{if(!Array.isArray(a))return null;const x=num(a[0],0,mx),y=num(a[1],0,my);return(x==null||y==null)?null:[x,y]};
 const L=edBlank();
 L.n=String(o.n||"שלב").replace(/[<>]/g,"").slice(0,24)||"שלב";
 L.w=num(o.w,0,3)||0;
 for(const a of (Array.isArray(o.p)?o.p.slice(0,80):[])){const x=num(a&&a[0],0,PW-40),y=num(a&&a[1],60,ED_GROUND-20),w=num(a&&a[2],40,PW);if(x!=null&&y!=null&&w!=null)L.p.push([x,y,Math.min(w,PW-x)])}
 for(const a of (Array.isArray(o.c)?o.c.slice(0,150):[])){const q=pair(a,PW-10,ED_GROUND);if(q)L.c.push(q)}
 for(const a of (Array.isArray(o.h)?o.h.slice(0,40):[])){const q=pair(a,PW-35,ED_GROUND);if(q)L.h.push(q)}
 L.g=pair(o.g,PW-45,ED_GROUND);
 L.s=pair(o.s,PW-30,ED_GROUND)||[40,ED_GROUND-38];
 L.ok=!!o.ok&&!!L.g;
 return L;
}
const edEncode=L=>"PX1:"+btoa(unescape(encodeURIComponent(JSON.stringify({n:L.n,w:L.w,p:L.p,c:L.c,h:L.h,g:L.g,s:L.s}))));
function edDecode(t){
 try{t=String(t).trim();if(!t.startsWith("PX1:"))return null;if(t.length>20000)return null;
  return edClean(JSON.parse(decodeURIComponent(escape(atob(t.slice(4))))))}catch(e){return null}
}
defMod({
 id:"editor",name:"עורך שלבים",icon:"🛠",
 load(d){ED.levels=[];if(d&&Array.isArray(d.levels))for(const o of d.levels.slice(0,10)){const L=edClean(o);if(L){L.ok=!!o.ok&&!!L.g;ED.levels.push(L)}}},
 save(){return {levels:ED.levels.map(l=>({...l}))}},

});

   };

 });

function edEditor(){
 const L=ED.cur;
 showScreen("עריכה: "+L.n,wrap=>{
  const scale=Math.min(1,(Math.min(window.innerWidth,560)-28)/PW);

  const c2=cv.getContext("2d");
  const tools=[["plat","▬ פלטפורמה"],["coin","● מטבע"],["haz","▲ מכשול"],["goal","⚑ שער"],["start","◉ התחלה"],["del","✕ מחק"]];
  const tb=el("div");tb.style.cssText="display:flex;flex-wrap:wrap;gap:5px;justify-content:center";
  const nameIn=document.createElement("input");nameIn.type="text";nameIn.maxLength=24;nameIn.value=L.n;

   const r=cv.getBoundingClientRect();

   else if(t==="coin"){if(L.c.length>=150){note("מקסימום 150 מטבעות");return}L.c.push([clamp(sn(x),10,PW-10),clamp(sn(y),20,ED_GROUND)])}

   else if(t==="del"){

  mk("חזרה לרשימה",()=>edList());

 });

/* ============================================================

const MS={active:[],done:{},flashTaken:{}};
const MS_TYPES={
 coins:{t:"אסוף {n} מטבעות",cur:()=>stats.coinsTotal},
 levels:{t:"השלם {n} שלבים",cur:()=>stats.levels},
 orbs:{t:"אסוף {n} גבישים",cur:()=>stats.orbs},

 nohit:{t:"השלם {n} שלבים בלי פגיעות",cur:()=>stats.nohit},

function flashList(){
 const slot=Math.floor(Date.now()/FLASH_SLOT),out=[];
 const types=["coins","levels","orbs","nohit"];
 for(let i=0;i<3;i++){
  const h=hash("fl"+slot+"_"+i),t=types[h%4],lv=Math.max(1,best);
  const n=t==="coins"?30+(h%5)*10+Math.floor(lv/3):t==="levels"?2+(h%3):t==="orbs"?3+(h%4):1+(h%2);
  out.push({id:"fl"+slot+"_"+i,src:"flash",t,n,dur:(5+(h>>>4)%5)*60000,rw:{c:100+n*8,cr:2+(h%3),xp:30,tk:1}});
 }

function giveMission(def){

 if(MS.active.some(m=>m.id===def.id)||MS.done[def.id]){return false}

function finishRace(){
 const R=RACE,{t,v}=R;
 /* זמני סיום של יריבים: אורך חלקי מהירות ממוצעת */
 const rows=[{n:"אתה",ms:R.fin,me:true}];
 R.riv.forEach(q=>rows.push({n:q.n,ms:(t.len/(q.sp*1.0))*1000}));
 rows.sort((a,b)=>a.ms-b.ms);
 const place=rows.findIndex(x=>x.me)+1;
 const rw=[{c:60,cr:6,tk:1,xp:40},{c:35,cr:3,tk:0,xp:25},{c:20,cr:1,tk:0,xp:15},{c:10,cr:0,tk:0,xp:8}][place-1];
 grantCoins(rw.c);addCrystals(rw.cr);if(rw.tk)addTokens(rw.tk);addXP(rw.xp);
 bump("race");if(place===1)bump("race_win");
 const nb=!RC.best[t.id]||R.fin<RC.best[t.id];
 if(nb){RC.best[t.id]=Math.floor(R.fin);pushRace()}
 save();sfx(place===1?"win":"ach");
 /* תוצאות */
 const o=document.createElement("div");
 o.style.cssText="position:absolute;inset:0;background:rgba(5,6,20,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:Arial;direction:rtl";
 const h=el("div",null,place===1?"🏆 ניצחת!":"מקום "+place+" מתוך 4");h.style.cssText="font-size:30px;font-weight:bold";
 o.appendChild(h);
 for(const r of rows){const d=el("div",null,(r.me?"▶ ":"")+r.n+" — "+raceFmt(r.ms));d.style.cssText="font-size:18px;"+(r.me?"color:#ffd24e;font-weight:bold":"");o.appendChild(d)}
 o.appendChild(el("div",null,"פרס: "+rw.c+"💰 "+rw.cr+"💎"+(rw.tk?" 1🎟":"")+" · "+rw.xp+"xp"+(nb?" · שיא אישי חדש!":"")));
 const b=el("button",null,"סגור");b.onclick=()=>{endRace(false);if($("screen").style.display==="block")openRace()};o.appendChild(b);
 R.box.appendChild(o);R.q.hidden=true;
}
/* ============================================================
   מודול בסיס אישי + בתים: חדר תלת-ממדי מדומה עם תאורה, 5 דרגות בית, ריהוט עם בונוסים אמיתיים,
   ייצור משאבים שנצבר גם כשאתה לא במשחק (עד 8 שעות) ומנוחה להטענת אנרגיה.
   ============================================================ */
const HOUSES=[
 {n:"קפסולה",ic:"🛖",cost:0,cr:0,slots:2,prod:1},

 {n:"וילה צפה",ic:"🏡",cost:1500,cr:30,slots:4,prod:3.5},
 {n:"מגדל זכוכית",ic:"🏢",cost:5000,cr:80,slots:5,prod:5.5},
 {n:"תחנת חלל פרטית",ic:"🛰",cost:15000,cr:200,slots:6,prod:8}
];
const FURN=[
 {id:"lamp",n:"מנורת ניאון",ic:"💡",cost:60,d:"+5% ייצור",prod:.05},
 {id:"plant",n:"צמח זוהר",ic:"🪴",cost:80,d:"+5% ייצור",prod:.05},
 {id:"bed",n:"מיטת טעינה",ic:"🛏",cost:200,d:"+20% מהירות מילוי אנרגיה",regen:.2},
 {id:"console",n:"קונסולת פיקוד",ic:"🖥",cost:300,d:"+15% ייצור",prod:.15},
 {id:"holo",n:"הולוגרמה",ic:"🔮",cost:500,d:"+10% ניסיון משלבים",xp:.1},
 {id:"gen",n:"גנרטור כוח",ic:"🔋",cost:800,d:"+25% ייצור, מנוחה כל שעה",prod:.25,rest:1}
];
const BASE={lv:1,furn:[],t:0,rest:0,regen(){return BASE.furn.includes("bed")?.2:0}};
const BASE_CAP=8*3600000;
function baseProdMul(){let m=HOUSES[BASE.lv-1].prod;let b=1;for(const id of BASE.furn){const f=FURN.find(x=>x.id===id);if(f&&f.prod)b+=f.prod}let bb=1;try{bb=1+bldBonus()}catch(e){}return m*b*bb}
function baseAcc(now){now=now||Date.now();const ms=Math.min(BASE_CAP,Math.max(0,now-BASE.t));const h=ms/3600000,m=baseProdMul();return {ms,h,coins:Math.floor(h*30*m),cr:Math.floor(h*1.2*m),en:Math.floor(h*4*m)}}
defMod({
 id:"base",name:"הבסיס שלי",icon:"🏠",
 badge:()=>baseAcc().h>=1?1:0,
 load(d){
  BASE.lv=1;BASE.furn=[];BASE.t=Date.now();BASE.rest=0;
  if(!d||typeof d!=="object")return;
  BASE.lv=Math.max(1,Math.min(HOUSES.length,Math.floor(Number(d.lv))||1));
  if(Array.isArray(d.furn))BASE.furn=d.furn.filter((x,i,a)=>FURN.some(f=>f.id===x)&&a.indexOf(x)===i).slice(0,HOUSES[BASE.lv-1].slots);
  const t=Number(d.t);BASE.t=isFinite(t)&&t>0&&t<=Date.now()?t:Date.now();
  BASE.rest=Number(d.rest)||0;
 },
 save(){return {lv:BASE.lv,furn:BASE.furn,t:BASE.t,rest:BASE.rest}},
 open(){openBase()}
});

 showScreen("הבסיס שלי",wrap=>{

   c.strokeStyle="#4eeaff";c.lineWidth=2;c.strokeRect(196,22,100,64);

   c.strokeStyle="rgba(78,234,255,.5)";c.beginPath();c.moveTo(0,110);c.lineTo(160,160);c.lineTo(320,110);c.stroke();

   BASE.furn.forEach((id,i)=>{
    const f=FURN.find(x=>x.id===id),p=pos[i%pos.length];

    fn:()=>{grantCoins(a.coins);addCrystals(a.cr);addEnergy(a.en);BASE.t=Date.now();bump("baseclaim");save();sfx("coin");render()}});
   const gen=BASE.furn.includes("gen"),rcd=(gen?3600000:2*3600000)-(Date.now()-BASE.rest);

   xhead(body,"שדרוג בית");
   if(BASE.lv<HOUSES.length){
    const n=HOUSES[BASE.lv];
    xcard(body,{ic:n.ic,nm:n.n,ds:n.cost+"💰 + "+n.cr+"💎 · "+n.slots+" משבצות ריהוט · ייצור ×"+n.prod,btn:"שדרג",off:coins<n.cost||MT.crystals<n.cr,
     fn:()=>{coins-=n.cost;MT.crystals-=n.cr;BASE.lv++;save();updateHUD();sfx("ach");xflash(.3,"#6bffb0");render()}});
   }else xcard(body,{ic:"★",nm:"הבית במקסימום",done:true});
   xhead(body,"ריהוט ("+BASE.furn.length+"/"+H.slots+")");
   for(const f of FURN){
    const has=BASE.furn.includes(f.id);
    xcard(body,{ic:f.ic,nm:f.n,ds:f.d+" · "+f.cost+"💰",done:has,btn:has?"הסר":"קנה והצב",off:!has&&(coins<f.cost||BASE.furn.length>=H.slots),
     fn:()=>{if(has)BASE.furn=BASE.furn.filter(x=>x!==f.id);else{coins-=f.cost;BASE.furn.push(f.id);bump("furn")}save();updateHUD();render()}});
   }
   body.appendChild(el("p","note","ריהוט שהוסר חוזר לחנות (תשלום חוזר). הייצור ממשיך להצטבר גם כשאתה לא במשחק, עד 8 שעות."));
  };
  render();raf=requestAnimationFrame(draw);
  screenCleanup=()=>{stop=true;cancelAnimationFrame(raf)};
 });
}

function gdCost(g,lv){let d=0;try{d=bunkerDisc()}catch(e){}return Math.max(1,Math.round(g.cost[lv]*(1-d)))}
const gdCd=g=>Math.round(g.cd*(1-.15*((GD.lv[g.id]||1)-1)));
function gdAllowed(){return playing&&!paused&&!menuOn&&!(xmode&&(xmode.type==="tourney"||xmode.type==="custom"))&&!RACE}
function useGadget(id){
 const g=GADS.find(x=>x.id===id),lv=GD.lv[id]||0;
 if(!g||!lv||!gdAllowed())return false;
 const now=Date.now();if((GD.cdT[id]||0)>now)return false;
 const px=player.x+15,py=player.y+19;
 if(id==="scan"){GD.scanT=now+8000+lv*2000;ringFx(px,py,"#4eeaff",120+lv*30);note("📡 סריקה פעילה")}
 else if(id==="jet"){player.vy=-(11+lv*2.2);player.ground=false;for(let i=0;i<20;i++)pt(px,py+18,(Math.random()-.5)*3,2+Math.random()*3,30,["#ff9a3c","#ffd24e","#fff"][i%3],4,"c")}
 else if(id==="emp"){
  const r=130+lv*40;let n=0;
  for(let i=hazards.length-1;i>=0;i--){const h=hazards[i];if(Math.hypot(h.x+17-px,h.y+15-py)<r){burst(h.x+17,h.y+15,"#4eeaff",10,5,3);hazards.splice(i,1);n++}}
  n+=bullets.length;bullets.length=0;ringFx(px,py,"#8f5bff",r);xflash(.2,"#8f5bff");popText(px,py-40,n?"EMP ×"+n:"EMP","#8f5bff");shake=Math.max(shake,5);
 }else if(id==="shd"){shield=Math.min(shield+1,5);ringFx(px,py,"#6bffb0",60);note("🛡 מגן הופעל")}
 else if(id==="dash"){player.vx=(player.face||1)*(12+lv*2);player.vy=Math.min(player.vy,-2);inv=Math.max(inv,18+lv*8);ringFx(px,py,"#ffd24e",50);for(let i=0;i<14;i++)pt(px,py,-(player.face||1)*(2+Math.random()*4),(Math.random()-.5)*2,22,"#ffd24e",4,"c")}
 else if(id==="phase"){inv=Math.max(inv,120+lv*60);ringFx(px,py,"#b34cff",70);xflash(.2,"#b34cff");note("👻 חסינות פעילה")}
 else if(id==="pull"){let n=0;const R=260+lv*120;for(const o of coinsL)if(!o.taken&&Math.hypot(o.x-px,o.y-py)<R){o.x=px;o.y=py;n++}for(const o of orbs)if(!o.taken&&Math.hypot(o.x-px,o.y-py)<R){o.x=px;o.y=py;n++}ringFx(px,py,"#4eeaff",R*.6);popText(px,py-40,"🧲 ×"+n,"#4eeaff")}
 sfx("warp");GD.cdT[id]=now+gdCd(g)*1000;bump("gadget");return true;
}

/* ============================================================
   חדרי חידות: 3 חדרים. כל חדר נפתר פעם ביום לפרס (גבישים/מטבעות/אסימון).
   1) רצף: מצא את הכלל והשלם. 2) אורות: כבה את כל האורות ברשת 3x3. 3) קוד: נחש 3 ספרות עם רמזים.
   ============================================================ */
const PZ={day:"",done:{},solved:0};
defMod({id:"puzzle",load(d){PZ.day="";PZ.done={};PZ.solved=0;if(d){PZ.day=String(d.day||"").slice(0,10);PZ.solved=Math.max(0,Math.floor(Number(d.solved))||0);for(const k of["seq","lights","code"])if(d.done&&d.done[k])PZ.done[k]=1}},save(){return PZ}});
function pzToday(){const t=new Date().toISOString().slice(0,10);if(PZ.day!==t){PZ.day=t;PZ.done={}}return t}
function pzSeed(k){return hash("pz"+k+pzToday())}
function pzWin(k,rw){PZ.done[k]=1;PZ.solved++;bump("puzzle");rw();addXP(25);save();sfx("win")}
function pzSeq(wrap,back){
 const s=pzSeed("seq"),kind=s%3,a=2+s%5,b=2+(s>>3)%4;let seq=[];
 for(let i=0;i<5;i++)seq.push(kind===0?a+i*b:kind===1?a*Math.pow(2,i):i*i+a);
 const ans=kind===0?a+5*b:kind===1?a*32:25+a;
 wrap.append(el("p","note","מה המספר הבא ברצף?"),el("h2",null,seq.join(" , ")+" , ?"));
 const inp=document.createElement("input");inp.type="number";inp.style.cssText="font-size:22px;padding:8px;width:140px;text-align:center";
 const go=el("button",null,"בדוק");const m=el("p","note","");
 go.onclick=()=>{if(+inp.value===ans){pzWin("seq",()=>{addCrystals(6);grantCoins(150)});m.textContent="נכון! +6💎 +150💰";go.disabled=true}else{m.textContent="לא נכון, נסה שוב";sfx("hit")}};
 wrap.append(inp,go,m);
}
function pzLights(wrap){
 let s=pzSeed("lights"),g=Array(9).fill(0);
 const tog=i=>{const x=i%3,y=Math.floor(i/3);for(const[dx,dy]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X>=0&&X<3&&Y>=0&&Y<3)g[Y*3+X]^=1}};
 for(let k=0;k<9;k++){s=(Math.imul(s,1103515245)+12345)>>>0;if((s>>>16)&1)tog(k)}
 if(!g.some(Boolean))tog(4);
 wrap.append(el("p","note","לחיצה מהפכת את התא ושכניו. כבה את כולם."));
 const grid=el("div");grid.style.cssText="display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center;margin:10px auto";
 const m=el("p","note","");let moves=0,fin=false;
 const draw=()=>{grid.replaceChildren();g.forEach((v,i)=>{const b=el("button");b.style.cssText="height:70px;border-radius:12px;border:0;background:"+(v?"#ffd24e":"#1a2250")+";box-shadow:"+(v?"0 0 16px #ffd24e":"none");b.onclick=()=>{if(fin)return;tog(i);moves++;sfx("click");draw();if(!g.some(Boolean)){fin=true;pzWin("lights",()=>{addCrystals(5);addTokens(1)});m.textContent="פתרת ב־"+moves+" מהלכים! +5💎 +1🎟"}}
  ;grid.appendChild(b)})};
 draw();wrap.append(grid,m);
}
function pzCode(wrap){
 const s=pzSeed("code");const code=[(s%9)+1,(s>>4)%10,(s>>8)%10];
 if(code[1]===code[0])code[1]=(code[1]+1)%10;if(code[2]===code[0]||code[2]===code[1])code[2]=(code[1]+3)%10===code[0]?(code[1]+4)%10:(code[1]+3)%10;
 wrap.append(el("p","note","3 ספרות שונות. 🟢 = ספרה נכונה במקום נכון, 🟡 = נכונה במקום אחר. יש 8 ניסיונות."));
 const inp=document.createElement("input");inp.maxLength=3;inp.inputMode="numeric";inp.style.cssText="font-size:24px;letter-spacing:8px;padding:8px;width:140px;text-align:center";

  tries++;let gr=0,ye=0;for(let i=0;i<3;i++){if(+v[i]===code[i])gr++;else if(code.includes(+v[i]))ye++}
  log.appendChild(el("div",null,v+"  "+"🟢".repeat(gr)+"🟡".repeat(ye)+(gr+ye?"":"⚫")));inp.value="";
  if(gr===3){fin=true;pzWin("code",()=>{addCrystals(8);grantCoins(250)});m.textContent="פיצחת! +8💎 +250💰"}
  else if(tries>=8){fin=true;m.textContent="נגמרו הניסיונות. הקוד היה "+code.join("")+". חזור מחר לקוד חדש."}};
 wrap.append(inp,go,log,m);
}

   אוצרות נדירים, אלבום מזכרות, דירוג עולמות וחדר תהילה.
   - אוצרות: תיבה מופיעה אחרי ~12% מהשלבים ופותחת פרס מטבלה (מטבעות/גבישים/נדיר/אסימון).

   - דירוג: 1-5 כוכבים לעולמות ולכוכבי הלכת. נשמר מקומית, ואם יש שרת גם משותף עם ממוצע.

defMod({id:"social",
 load(d){TRS.opened=0;TRS.pending=0;TRS.log=[];SVN.got={};RT.r={};if(!d)return;
  const t=d.trs||{};TRS.opened=Math.max(0,Math.floor(+t.opened)||0);TRS.pending=Math.max(0,Math.min(20,Math.floor(+t.pending)||0));TRS.log=Array.isArray(t.log)?t.log.slice(0,12).map(x=>String(x).slice(0,60)):[];
  if(d.sv&&typeof d.sv==="object")for(const k in d.sv){const v=+d.sv[k];if(v>0)SVN.got[k.slice(0,30)]=v}
  if(d.rt&&typeof d.rt==="object")for(const k in d.rt){const v=Math.floor(+d.rt[k]);if(v>=1&&v<=5)RT.r[k.slice(0,20)]=v}},
 save(){return{trs:TRS,sv:SVN.got,rt:RT.r}}});

hook("complete",()=>{if(Math.random()<.12){TRS.pending=Math.min(20,TRS.pending+1);note("🧰 מצאת תיבת אוצר! פתח אותה בחדר האוצרות")}});
function trsOpen(){
 if(TRS.pending<1)return null;TRS.pending--;TRS.opened++;bump("treasure");
 const r=Math.random();let t;
 if(r<.45){const v=100+Math.floor(Math.random()*300);grantCoins(v);t=v+"💰"}
 else if(r<.75){const v=3+Math.floor(Math.random()*8);addCrystals(v);t=v+"💎"}
 else if(r<.88){addTokens(1);t="1🎟"}
 else if(r<.97){giveRare(1,"treasure");t="פריט נדיר 🎁"}
 else{giveRare(2,"treasure");t="פריט אפי! ✨"}
 TRS.log.unshift(t);TRS.log.length=Math.min(TRS.log.length,12);save();sfx("win");return t;
}

function drawHero(c,x,y,w,h,sk,o){
 o=o||{};
 const hue=((o.t||0)*.12)%360;
 const gs=o.gear&&o.gear.suit;
 const body=gs?gs.body:sk.body==="hue"?"hsl("+hue+",85%,68%)":sk.body;
 const glow=gs?gs.glow:sk.glow==="hue"?"hsl("+hue+",95%,60%)":sk.glow;
 const sq=o.sq||1,face=o.face||1;
 c.save();
 c.globalAlpha=o.a==null?1:o.a;
 c.translate(x+w/2,y+h);c.scale(1/sq,sq);
 c.shadowBlur=SB(18);c.shadowColor=glow;
 if(o.gear)xGearApi.draw(c,w,h,o.gear,o,0);
 if(sk.shape==="robot"){
  c.fillStyle=body;c.fillRect(-w/2,-h,w,h);
  c.shadowBlur=0;
  c.fillStyle=sk.vis;c.fillRect(-10+face*2,-h+7,20,5);
  c.fillStyle=glow;c.fillRect(-1,-h-7,2,7);
  c.beginPath();c.arc(0,-h-8,2.5,0,6.283);c.fill();
  c.fillRect(-w/2,-3,w,3);
 }else if(sk.shape==="blob"){
  rr(c,-w/2,-h,w,h,14);c.fillStyle=body;c.fill();
  c.shadowBlur=0;
  c.fillStyle="#fff";
  for(const ex of[-6,6]){c.beginPath();c.arc(ex+face*1.5,-h+16,5,0,6.283);c.fill()}
  c.fillStyle="#0b1630";
  for(const ex of[-6,6]){c.beginPath();c.arc(ex+face*3,-h+16,2.4,0,6.283);c.fill()}
  c.globalAlpha*=.4;c.fillStyle=glow;rr(c,-w/2+4,-13,w-8,7,3);c.fill();
 }else{
  rr(c,-w/2,-h+14,w,h-14,8);c.fillStyle=body;c.fill();
  c.beginPath();c.arc(0,-h+14,w/2+1,0,6.283);c.fill();
  c.shadowBlur=0;
  c.fillStyle=sk.vis;c.beginPath();c.ellipse(face*2,-h+14,10,8,0,0,6.283);c.fill();
  c.fillStyle="rgba(255,255,255,.6)";c.beginPath();c.ellipse(face*2-3,-h+11,3,2,0,0,6.283);c.fill();
  c.fillStyle=glow;c.fillRect(-4,-h+27,8,5);
 }
 c.shadowBlur=0;if(o.gear)xGearApi.draw(c,w,h,o.gear,o,1);
 c.restore();
}
